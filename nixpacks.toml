# Tells Railway (Nixpacks) to build the React frontend as part of every deploy,
# so `static/dist/` never has to be committed to git.
#
# NOTE: defining [phases.setup] here replaces Nixpacks' auto-detected Python
# setup, which normally creates a virtualenv for you. Nix's system Python is
# marked "externally managed" (PEP 668), so pip can't install into it
# directly — we create our own venv at /opt/venv, same as Nixpacks' default
# Python provider does, and use that venv's pip/python for everything.

[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements.txt",
  "cd frontend && npm install"
]

[phases.build]
cmds = [
  "cd frontend && npm run build"
]

[start]
cmd = "/opt/venv/bin/python -m gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
