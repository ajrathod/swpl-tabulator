<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>{{comp.name}} — Live Results</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#F4511E;--orange-l:#FFF3F0;
    --blue:#1565C0;--blue-l:#E3F2FD;
    --green:#2E7D32;--green-l:#E8F5E9;
    --gold:#F9A825;--gold-l:#FFF8E1;
    --red:#C62828;--red-l:#FFEBEE;
    --g50:#FAFAFA;--g100:#F5F5F5;--g200:#EEEEEE;--g300:#E0E0E0;
    --g400:#BDBDBD;--g500:#9E9E9E;--g600:#757575;--g700:#616161;--g900:#212121;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'DM Sans',sans-serif;background:var(--g100);color:var(--g900);min-height:100vh;padding-bottom:56px}
  /* Header */
  .header{background:var(--orange);color:#fff;padding:14px 14px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .header-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .h-logo{font-size:22px}
  .h-title{font-size:16px;font-weight:700;flex:1}
  .h-comp{font-size:11px;opacity:.8}
  .live{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600}
  .live::before{content:'';width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
  /* Group tabs */
  .gtabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .gtabs::-webkit-scrollbar{display:none}
  .gtab{flex-shrink:0;padding:8px 12px;font-size:12px;font-weight:600;color:rgba(255,255,255,.7);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit;background:none;border-top:none;border-left:none;border-right:none;transition:all .15s}
  .gtab:hover{color:#fff}
  .gtab.active{color:#fff;border-bottom-color:#fff}
  /* Content */
  .content{padding:12px 12px;max-width:680px;margin:0 auto}
  /* Event pills */
  .epills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding:2px 0}
  .epills::-webkit-scrollbar{display:none}
  .epill{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:var(--g200);color:var(--g600);border:none;font-family:inherit;transition:all .15s}
  .epill.active{background:var(--orange);color:#fff}
  /* Stage label */
  .slbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin:14px 0 8px}
  .slbl::after{content:'';flex:1;height:1px;background:var(--g200)}
  .slbl.ht{color:var(--blue)}.slbl.sm{color:var(--green)}.slbl.fn{color:#B8860B}
  /* Heat card */
  .hcard{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden;margin-bottom:10px}
  .hcard-head{padding:9px 14px;display:flex;align-items:center;justify-content:space-between}
  .hcard-head.hh{background:var(--blue);color:#fff}
  .hcard-head.sh{background:var(--green);color:#fff}
  .hcard-head.fh{background:var(--gold);color:#fff}
  .hcard-head h3{font-size:13px;font-weight:700}
  .hcard-head .sc{font-size:11px;opacity:.8}
  /* Skater row */
  .sk-row{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--g100);gap:10px}
  .sk-row:last-child{border-bottom:none}
  .sk-row.r1{background:var(--gold-l)}.sk-row.r2{background:var(--g50)}.sk-row.r3{background:#FFF8F0}
  .rank-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
  .rank-circle.p1{background:var(--gold-l)}.rank-circle.p2{background:var(--g100)}.rank-circle.p3{background:#FFF3E0}
  .rank-circle.pn{background:var(--g100);font-size:13px;font-weight:700;color:var(--g500)}
  .sk-info{flex:1;min-width:0}
  .sk-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sk-meta{font-size:11px;color:var(--g400);margin-top:1px;font-family:'DM Mono',monospace}
  .sk-pl{text-align:right;flex-shrink:0}
  .pl-medal{font-size:22px}
  .pl-num{font-size:18px;font-weight:700;color:var(--g700);font-family:'DM Mono',monospace}
  .pl-dq{font-size:12px;font-weight:700;color:var(--red);background:var(--red-l);padding:2px 7px;border-radius:10px}
  .pl-wait{font-size:12px;color:var(--g400)}
  /* Waiting */
  .waiting{background:#fff;border-radius:12px;padding:28px;text-align:center;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .waiting .wi{font-size:32px;margin-bottom:8px}
  .waiting p{font-size:13px;color:var(--g400)}
  /* Qual banner */
  .qual-banner{background:var(--green-l);border-radius:8px;padding:8px 14px;margin-bottom:8px;font-size:12px;color:var(--green);font-weight:600;display:flex;align-items:center;gap:6px}
  /* Direct pill */
  .direct-pill{display:inline-flex;align-items:center;gap:4px;background:var(--blue-l);color:var(--blue);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;margin-bottom:10px}
  /* Refresh bar */
  .rbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--g200);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--g500);z-index:99}
  .rbar button{font-size:12px;color:var(--orange);background:none;border:none;font-weight:600;cursor:pointer;font-family:inherit}
  /* No data */
  .nodata{text-align:center;padding:60px 20px;color:var(--g400)}
  .nodata .ni{font-size:48px;margin-bottom:12px}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <span class="h-logo">⛸️</span>
    <div style="flex:1">
      <div class="h-title">Live Results</div>
      <div class="h-comp">{{comp.name}}{% if comp.venue %} · {{comp.venue}}{% endif %}</div>
    </div>
    <span class="live">LIVE</span>
  </div>
  <div class="gtabs" id="gtabs">
    <div style="padding:10px;font-size:12px;color:rgba(255,255,255,.6)">Loading…</div>
  </div>
</div>

<div class="content" id="content">
  <div class="nodata"><div class="ni">🏁</div><p>Waiting for competition data…</p></div>
</div>

<div class="rbar">
  <span id="last-upd">Auto-refreshes every 10s</span>
  <button onclick="loadGroup(curGroup)">↻ Refresh</button>
</div>

<script>
const COMP_ID={{comp.id}};
let curGroup=null, curEvent=null, allGroups={}, timer=null;

async function init(){
  const r=await fetch(`/api/${COMP_ID}/groups`);
  allGroups=await r.json();
  const groups=Object.keys(allGroups).sort();
  const tabs=document.getElementById('gtabs');
  if(!groups.length){tabs.innerHTML='<div style="padding:10px;font-size:12px;color:rgba(255,255,255,.6)">No data yet</div>';return;}
  tabs.innerHTML=groups.map(g=>`<button class="gtab" onclick="selGroup('${esc(g)}')">${g}</button>`).join('');
  selGroup(groups[0]);
  timer=setInterval(()=>{if(curGroup)loadGroup(curGroup);},10000);
}

function selGroup(g){
  curGroup=g;
  document.querySelectorAll('.gtab').forEach(b=>b.classList.toggle('active',b.textContent===g));
  loadGroup(g);
}

async function loadGroup(group){
  if(!group) return;
  const r=await fetch(`/api/${COMP_ID}/group/${encodeURIComponent(group)}`);
  const events=await r.json();
  const names=Object.keys(events);
  const hasPoints=Object.values(events).some(e=>e.points_event);
  if(!curEvent||(!events[curEvent]&&curEvent!=='__standings__')) curEvent=names[0];
  const c=document.getElementById('content');

  const pills=names.map(n=>`<button class="epill${n===curEvent?' active':''}" onclick="switchEv('${esc(n)}',this)">${n}</button>`).join('');
  const standingsPill=hasPoints?`<button class="epill${curEvent==='__standings__'?' active':''}" onclick="switchEv('__standings__',this)">🏆 Standings</button>`:'';
  c.innerHTML=`<div class="epills">${pills}${standingsPill}</div><div id="ev-body"></div>`;
  c._events=events;

  if(curEvent==='__standings__') await loadStandings(group);
  else renderEv(events[curEvent]);

  document.getElementById('last-upd').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

async function switchEv(name,btn){
  curEvent=name;
  document.querySelectorAll('.epill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(name==='__standings__'){await loadStandings(curGroup);return;}
  renderEv((document.getElementById('content')._events||{})[name]);
}

// ── Standings (public) ──────────────────────────────────────────────────────
async function loadStandings(group){
  const body=document.getElementById('ev-body');
  body.innerHTML=`<div style="text-align:center;padding:30px;color:var(--g400)">Loading…</div>`;
  const r=await fetch(`/api/${COMP_ID}/standings/${encodeURIComponent(group)}`);
  const d=await r.json();
  const data=d.standings||[];
  const tbEv=d.tiebreaker_event||'';

  if(!data.length){
    body.innerHTML=`<div class="waiting"><div class="wi">📊</div><p>No results yet</p></div>`;
    return;
  }

  const rows=data.map(row=>{
    const pcls=row.position===1?'p1':row.position===2?'p2':row.position===3?'p3':'pn';
    const bd=Object.entries(row.breakdown||{}).map(([ev,info])=>{
      const suffix=['st','nd','rd'][info.place-1]||'th';
      return `${ev.replace(' Distance','')}: ${info.pts}pts`;
    }).join(' · ');
    const tbWarn=row.tb_needed
      ?`<span style="font-size:10px;background:#FFF3E0;color:#E65100;padding:1px 6px;border-radius:8px;margin-left:4px">TIE</span>`
      :'';
    return `<div class="sk-row${row.position<=3?' r'+row.position:''}">
      <div class="rank-circle ${pcls}"><span>${row.position}</span></div>
      <div class="sk-info">
        <div class="sk-name">${row.name}${tbWarn}</div>
        <div class="sk-meta">#${row.panel} · ${row.club}</div>
        ${bd?`<div class="sk-meta" style="margin-top:2px">${bd}</div>`:''}
      </div>
      <div class="sk-pl"><span style="font-size:17px;font-weight:700;color:var(--g700);font-family:'DM Mono',monospace">${row.points}<span style="font-size:11px;font-weight:500;color:var(--g400)">pts</span></span></div>
    </div>`;
  }).join('');

  body.innerHTML=`
    <div style="background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden;margin-bottom:10px">
      <div style="padding:10px 14px;background:var(--gold);color:#fff;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center">
        <span>🏆 Overall Standings</span>
        <span style="font-size:11px;opacity:.85">1st=30 · 2nd=20 · 3rd=10 · 4th=5</span>
      </div>
      ${rows}
    </div>
    ${tbEv?`<div style="font-size:11px;color:var(--g500);text-align:center;padding:4px">Tiebreaker: ${tbEv}</div>`:''}`;
}

function renderEv(ev){
  const body=document.getElementById('ev-body');
  if(!ev){body.innerHTML='';return;}
  let html='';
  if(ev.type==='direct_final'){
    html+=`<div class="direct-pill">🏁 Direct Final</div>`;
    html+=ev.finals.map(h=>h.skaters.length?hCard(h,'fh'):`<div class="waiting"><div class="wi">⏳</div><p>Not yet started</p></div>`).join('');
    body.innerHTML=html;return;
  }
  if(ev.heats.length){
    html+=`<div class="slbl ht">Heats</div>`;
    html+=ev.heats.map(h=>hCard(h,'hh')).join('');
    const hasRes=ev.heats.some(h=>h.skaters.some(s=>s.placement));
    const advanced=ev.semis.some(h=>h.skaters.length)||ev.finals.some(h=>h.skaters.length);
    if(hasRes&&advanced) html+=`<div class="qual-banner">✅ Qualifiers advanced</div>`;
  }
  if(ev.semis.length){
    html+=`<div class="slbl sm">Semi-Finals</div>`;
    html+=ev.semis.map(h=>h.skaters.length?hCard(h,'sh'):`<div class="waiting"><div class="wi">⏳</div><p>Waiting for heat results</p></div>`).join('');
  }
  if(ev.finals.length){
    html+=`<div class="slbl fn">Final</div>`;
    html+=ev.finals.map(h=>h.skaters.length?hCard(h,'fh'):`<div class="waiting"><div class="wi">🏆</div><p>Final lineup coming soon</p></div>`).join('');
  }
  body.innerHTML=html;
}

function hCard(heat,hdrCls){
  const label=heat.stage==='Final'?'Final':`${heat.stage} ${heat.number}`;
  const sorted=[...heat.skaters].sort((a,b)=>{
    const pa=/^\d+$/.test(a.placement)?parseInt(a.placement):999;
    const pb=/^\d+$/.test(b.placement)?parseInt(b.placement):999;
    return pa-pb;
  });
  const rows=sorted.map((s,i)=>{
    const pl=s.placement;
    const num=parseInt(pl);
    const ranked=!isNaN(num);
    const rc=num===1?'r1':num===2?'r2':num===3?'r3':'';
    const bcls=num===1?'p1':num===2?'p2':num===3?'p3':'pn';

    // Plain number placement — no medals
    let plEl='';
    if(pl==='DQ')    plEl=`<div class="sk-pl"><span class="pl-dq">DQ</span></div>`;
    else if(ranked)  plEl=`<div class="sk-pl"><span class="pl-num">${pl}</span></div>`;
    else             plEl=`<div class="sk-pl"><span class="pl-wait">—</span></div>`;

    return `<div class="sk-row ${rc}">
      <div class="rank-circle ${bcls}"><span>${ranked?pl:i+1}</span></div>
      <div class="sk-info"><div class="sk-name">${s.full_name}</div><div class="sk-meta">#${s.panel} · ${s.club}</div></div>
      ${plEl}</div>`;
  }).join('');
  return `<div class="hcard">
    <div class="hcard-head ${hdrCls}"><h3>${label}</h3><span class="sc">${heat.skaters.length} skaters</span></div>
    ${rows||'<div style="padding:16px;text-align:center;color:var(--g400);font-size:13px">Waiting for lineup</div>'}
  </div>`;
}

function esc(s){return(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
init();
</script>
</body>
</html>
