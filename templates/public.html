<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>{{comp.name}} — Live Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Design tokens: light ─────────────────────────────────────────────── */
:root {
  --brand:      #F4511E;
  --brand-dim:  rgba(244,81,30,.15);
  --ice:        #5BB8FF;
  --gold:       #F59E0B;
  --silver:     #94A3B8;
  --bronze:     #C27D3A;
  --dq:         #EF4444;
  --bg:         #F2F3F7;
  --bg-card:    #FFFFFF;
  --bg-header:  #FFFFFF;
  --bg-nav:     #FFFFFF;
  --border:     rgba(0,0,0,.08);
  --divider:    rgba(0,0,0,.06);
  --text:       #0E0F14;
  --text-dim:   rgba(14,15,20,.55);
  --text-faint: rgba(14,15,20,.35);
  --pill-bg:    rgba(14,15,20,.07);
  --stage-heat: #2563EB;
  --stage-semi: #7C3AED;
  --stage-final:#D97706;
  --live-bg:    #FEE2E2;
  --live-dot:   #EF4444;
  --live-text:  #991B1B;
  --r1-bg:      rgba(245,158,11,.08);
  --r2-bg:      rgba(148,163,184,.07);
  --r3-bg:      rgba(194,125,58,.07);
  --row-sep:    rgba(0,0,0,.05);
  color-scheme: light;
}
/* Dark theme */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:         #0A0A0F;
    --bg-card:    #13131C;
    --bg-header:  #1A1A27;
    --bg-nav:     #1A1A27;
    --border:     rgba(255,255,255,.09);
    --divider:    rgba(255,255,255,.06);
    --text:       #F0F1F5;
    --text-dim:   rgba(240,241,245,.55);
    --text-faint: rgba(240,241,245,.35);
    --pill-bg:    rgba(255,255,255,.09);
    --r1-bg:      rgba(245,158,11,.08);
    --r2-bg:      rgba(148,163,184,.06);
    --r3-bg:      rgba(194,125,58,.07);
    --row-sep:    rgba(255,255,255,.05);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:         #0A0A0F;
  --bg-card:    #13131C;
  --bg-header:  #1A1A27;
  --bg-nav:     #1A1A27;
  --border:     rgba(255,255,255,.09);
  --divider:    rgba(255,255,255,.06);
  --text:       #F0F1F5;
  --text-dim:   rgba(240,241,245,.55);
  --text-faint: rgba(240,241,245,.35);
  --pill-bg:    rgba(255,255,255,.09);
  --r1-bg:      rgba(245,158,11,.08);
  --r2-bg:      rgba(148,163,184,.06);
  --r3-bg:      rgba(194,125,58,.07);
  --row-sep:    rgba(255,255,255,.05);
  color-scheme: dark;
}

/* ── Reset & base ─────────────────────────────────────────────────────── */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased;
  transition: background .2s,color .2s;
}

/* ── App shell ────────────────────────────────────────────────────────── */
.app-shell { display:flex; flex-direction:column; height:100dvh; height:100vh; }
.app-header {
  background:var(--bg-header); border-bottom:1px solid var(--border);
  flex-shrink:0; z-index:100;
  box-shadow:0 1px 6px rgba(0,0,0,.07);
  position:sticky; top:0;
}
.header-top {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px 8px; gap:10px;
}
.header-identity {}
.header-logo {
  font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:800;
  letter-spacing:.05em; color:var(--text); line-height:1;
}
.header-logo .slash { color:var(--brand); }
.header-comp { font-size:12px; color:var(--text-dim); margin-top:1px; line-height:1; }
.header-actions { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.live-pill {
  display:flex; align-items:center; gap:5px;
  background:var(--live-bg); border:1px solid rgba(239,68,68,.25);
  padding:3px 9px; border-radius:20px;
  font-size:10px; font-weight:700; letter-spacing:.08em; color:var(--live-text);
}
.live-dot { width:6px; height:6px; border-radius:50%; background:var(--live-dot); animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.theme-btn {
  background:var(--pill-bg); border:1px solid var(--border);
  border-radius:20px; width:32px; height:32px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--text-dim); font-size:14px;
  transition:background .15s;
}
.theme-btn:hover { background:var(--border); }

/* ── Tab bar ──────────────────────────────────────────────────────────── */
.tab-bar {
  display:flex; border-top:1px solid var(--border);
  background:var(--bg-header);
}
.tab-btn {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; padding:8px 4px 6px;
  background:none; border:none; cursor:pointer;
  color:var(--text-faint); font-size:10px; font-weight:500;
  letter-spacing:.02em; position:relative;
  transition:color .15s;
  -webkit-tap-highlight-color:transparent;
}
.tab-btn .tab-icon { font-size:16px; line-height:1; }
.tab-btn .tab-label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
.tab-btn::after {
  content:''; position:absolute; bottom:0; left:20%; right:20%; height:2px;
  background:var(--brand); border-radius:2px 2px 0 0;
  opacity:0; transform:scaleX(0); transition:opacity .15s,transform .15s;
}
.tab-btn.active { color:var(--brand); }
.tab-btn.active::after { opacity:1; transform:scaleX(1); }

/* ── Search bar (shown only on Search tab) ────────────────────────────── */
.search-wrap {
  background:var(--bg-header); border-bottom:1px solid var(--border);
  padding:8px 12px; flex-shrink:0;
}
.search-wrap.hidden { display:none; }
.search-inner {
  display:flex; align-items:center; gap:8px;
  background:var(--pill-bg); border:1px solid var(--border);
  border-radius:10px; padding:0 12px; height:38px;
}
.search-icon { color:var(--text-faint); flex-shrink:0; width:16px; height:16px; }
#searchInput {
  flex:1; background:none; border:none; outline:none;
  font-family:inherit; font-size:15px; color:var(--text);
}
#searchInput::placeholder { color:var(--text-faint); }
.search-clear {
  background:none; border:none; cursor:pointer; color:var(--text-faint);
  font-size:14px; padding:4px; line-height:1; display:none;
}
.search-clear.visible { display:block; }

/* ── Content area ─────────────────────────────────────────────────────── */
.content-area { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.view { display:none; }
.view.active { display:block; }
.content-pad { padding:12px 12px 80px; }

/* ── Group header (Results tab) ───────────────────────────────────────── */
.group-section { margin-bottom:4px; }
.group-label {
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-faint); padding:16px 4px 6px;
}

/* ── Event card ───────────────────────────────────────────────────────── */
.ev-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:12px; margin-bottom:8px; overflow:hidden;
}
.ev-head {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px; cursor:pointer; user-select:none;
  -webkit-tap-highlight-color:transparent;
  gap:8px;
}
.ev-head-left { flex:1; min-width:0; }
.ev-name {
  font-size:15px; font-weight:600; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ev-meta { font-size:12px; color:var(--text-dim); margin-top:1px; }
.ev-head-right { display:flex; align-items:center; gap:6px; flex-shrink:0; }
.stage-pills { display:flex; gap:4px; flex-wrap:wrap; }
.stage-pill {
  font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  padding:2px 7px; border-radius:20px;
}
.sp-heat  { background:rgba(37,99,235,.12); color:var(--stage-heat); }
.sp-semi  { background:rgba(124,58,237,.12); color:var(--stage-semi); }
.sp-final { background:rgba(217,119,6,.12);  color:var(--stage-final); }
.sp-direct{ background:rgba(244,81,30,.12);  color:var(--brand); }
.ev-chevron {
  color:var(--text-faint); font-size:12px;
  transition:transform .2s; flex-shrink:0;
}
.ev-card.open .ev-chevron { transform:rotate(180deg); }
.ev-body { display:none; border-top:1px solid var(--divider); }
.ev-card.open .ev-body { display:block; }

/* ── Relay card (Results tab) ─────────────────────────────────────────── */
.relay-section-label {
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-faint); padding:16px 4px 6px;
}
.relay-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:12px; margin-bottom:8px; overflow:hidden;
}
.relay-head {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px; cursor:pointer; user-select:none;
  background:rgba(91,184,255,.06);
  -webkit-tap-highlight-color:transparent; gap:8px;
}
.relay-badge {
  font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ice); background:rgba(91,184,255,.15);
  padding:2px 7px; border-radius:20px; flex-shrink:0;
}
.relay-name { font-size:14px; font-weight:600; color:var(--text); }
.relay-body { display:none; border-top:1px solid var(--divider); }
.relay-card.open .relay-body { display:block; }
.relay-card.open .ev-chevron { transform:rotate(180deg); }

/* ── Stage section label ──────────────────────────────────────────────── */
.slbl {
  font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  padding:8px 14px 4px; color:var(--text-faint);
}
.slbl.ht { color:var(--stage-heat); }
.slbl.sm { color:var(--stage-semi); }
.slbl.fn { color:var(--stage-final); }
.direct-pill {
  font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--brand); padding:8px 14px 4px;
}

/* ── Heat card ────────────────────────────────────────────────────────── */
.hcard { padding:0; }
.hcard-head {
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 14px; border-bottom:1px solid var(--divider);
}
.hcard-head h3 { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
.hcard-head .sc { font-size:11px; color:var(--text-faint); }
.hh { color:var(--stage-heat); }
.sh { color:var(--stage-semi); }
.fh { color:var(--stage-final); }

/* ── Skater row ───────────────────────────────────────────────────────── */
.sk-row {
  display:flex; align-items:center; gap:10px;
  padding:9px 14px; border-bottom:1px solid var(--divider);
  animation:fadeIn .25s ease both;
}
.sk-row:last-child { border-bottom:none; }
.sk-row.r1 { background:var(--r1-bg); }
.sk-row.r2 { background:var(--r2-bg); }
.sk-row.r3 { background:var(--r3-bg); }
@keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
.rank-num {
  min-width:24px; text-align:center; font-size:14px; font-weight:700;
  font-family:'Barlow Condensed',sans-serif; flex-shrink:0;
}
.rank-num.rn { color:var(--text-faint); }
.rank-num.p1 { color:var(--gold); }
.rank-num.p2 { color:var(--silver); }
.rank-num.p3 { color:var(--bronze); }
.rank-num.pn { color:var(--text-dim); }
.sk-info { flex:1; min-width:0; }
.sk-name { font-size:15px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sk-meta { font-size:12px; color:var(--text-dim); margin-top:1px; }
.sk-place { flex-shrink:0; }
.place-num {
  min-width:28px; height:28px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; font-family:'Barlow Condensed',sans-serif;
}
.place-num.p1 { background:rgba(245,158,11,.15); color:var(--gold); }
.place-num.p2 { background:rgba(148,163,184,.15); color:var(--silver); }
.place-num.p3 { background:rgba(194,125,58,.15);  color:var(--bronze); }
.place-num.pn { background:var(--pill-bg); color:var(--text-dim); }
.place-wait { color:var(--text-faint); font-size:15px; width:28px; text-align:center; }
.place-dq {
  font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  background:rgba(239,68,68,.1); color:var(--dq);
  padding:2px 7px; border-radius:20px;
}

/* ── Team rows (relay) ────────────────────────────────────────────────── */
.team-row {
  display:flex; align-items:center; gap:10px;
  padding:9px 14px; border-bottom:1px solid var(--divider);
}
.team-row:last-child { border-bottom:none; }
.team-bib {
  width:28px; height:28px; border-radius:50%; border:2px solid currentColor;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; flex-shrink:0;
}
.team-info { flex:1; min-width:0; }
.team-name { font-size:15px; color:var(--text); }
.team-members { font-size:12px; color:var(--text-dim); margin-top:1px; }

/* ── Standings ────────────────────────────────────────────────────────── */
.standings-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:12px; overflow:hidden; margin-top:8px;
}
.standings-head {
  padding:10px 14px; border-bottom:1px solid var(--divider);
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;
}
.standings-head h3 { font-size:13px; font-weight:700; }
.standings-pts-key { font-size:10px; color:var(--text-faint); }
.standings-row {
  display:flex; align-items:center; gap:10px;
  padding:9px 14px; border-bottom:1px solid var(--divider);
}
.standings-row:last-child { border-bottom:none; }
.standings-row.r1 { background:var(--r1-bg); }
.standings-row.r2 { background:var(--r2-bg); }
.standings-row.r3 { background:var(--r3-bg); }
.st-pos {
  min-width:28px; height:28px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:700; font-family:'Barlow Condensed',sans-serif; flex-shrink:0;
}
.st-pos.p1 { background:rgba(245,158,11,.15); }
.st-pos.p2 { background:rgba(148,163,184,.15); }
.st-pos.p3 { background:rgba(194,125,58,.15); }
.st-pos.pn { background:var(--pill-bg); font-size:13px; color:var(--text-dim); }
.st-info { flex:1; min-width:0; }
.st-name { font-size:15px; color:var(--text); }
.st-breakdown { font-size:11px; color:var(--text-faint); margin-top:2px; }
.st-pts { font-size:18px; font-weight:700; font-family:'Barlow Condensed',sans-serif; text-align:right; }
.st-pts-label { font-size:9px; color:var(--text-faint); text-align:right; letter-spacing:.05em; text-transform:uppercase; }
.tie-badge {
  font-size:9px; font-weight:700; letter-spacing:.06em;
  background:rgba(239,68,68,.1); color:var(--dq);
  padding:1px 5px; border-radius:20px; margin-left:5px;
}

/* ── Search results (Search tab) ─────────────────────────────────────── */
.sr-count { font-size:12px; color:var(--text-faint); padding:4px 2px 10px; font-weight:500; }
.sr-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:12px; overflow:hidden; margin-bottom:8px;
}
.sr-skater-head {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px; border-bottom:1px solid var(--divider);
}
.sr-skater-name { font-size:16px; font-weight:600; }
.sr-skater-meta { font-size:12px; color:var(--text-dim); margin-top:2px; }
.sr-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 14px; border-bottom:1px solid var(--divider); gap:10px;
}
.sr-row:last-child { border-bottom:none; }
.sr-ev-name { font-size:14px; color:var(--text); }
.sr-ev-meta { font-size:11px; color:var(--text-faint); margin-top:1px; }
.sr-place {
  min-width:30px; height:30px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700; font-family:'Barlow Condensed',sans-serif; flex-shrink:0;
}
.sr-place.p1 { background:rgba(245,158,11,.15); color:var(--gold); }
.sr-place.p2 { background:rgba(148,163,184,.15); color:var(--silver); }
.sr-place.p3 { background:rgba(194,125,58,.15);  color:var(--bronze); }
.sr-place.pn { background:var(--pill-bg); color:var(--text-dim); }
.sr-place.pending { color:var(--text-faint); background:none; font-size:18px; }

/* ── Schedule (Schedule tab) ──────────────────────────────────────────── */
.sched-section {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:12px; overflow:hidden; margin-bottom:8px;
}
.sched-section-hdr {
  display:flex; align-items:center; gap:8px;
  padding:10px 14px; background:var(--pill-bg); border-bottom:1px solid var(--divider);
}
.sched-section-time { font-size:12px; font-weight:700; color:var(--brand); flex-shrink:0; }
.sched-section-name { font-size:13px; font-weight:600; color:var(--text); }
.sched-row {
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; border-bottom:1px solid var(--divider);
}
.sched-row:last-child { border-bottom:none; }
.sched-row.done { opacity:.5; }
.sched-num { font-size:12px; color:var(--text-faint); min-width:28px; flex-shrink:0; font-weight:600; }
.sched-info { flex:1; min-width:0; }
.sched-label { font-size:14px; color:var(--text); }
.sched-meta { font-size:11px; color:var(--text-dim); margin-top:1px; }
.sched-badge {
  font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  padding:3px 9px; border-radius:20px; flex-shrink:0;
}
.sched-badge.done     { background:rgba(0,0,0,.07); color:var(--text-faint); }
.sched-badge.in_progress { background:var(--live-bg); color:var(--live-text); display:flex; align-items:center; gap:5px; }
.sched-badge.next     { background:rgba(37,99,235,.12); color:var(--stage-heat); }
.sched-badge.pending  { background:var(--pill-bg); color:var(--text-faint); }
.sched-live-dot { width:6px; height:6px; border-radius:50%; background:var(--live-dot); animation:pulse 1.4s ease-in-out infinite; flex-shrink:0; }

/* ── Program (Program tab) ────────────────────────────────────────────── */
.prog-group-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:12px; overflow:hidden; margin-bottom:8px;
}
.prog-group-hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px; cursor:pointer; user-select:none;
  background:var(--pill-bg); -webkit-tap-highlight-color:transparent; gap:8px;
}
.prog-group-name { font-size:15px; font-weight:600; color:var(--text); }
.prog-group-count { font-size:12px; color:var(--text-faint); margin-left:6px; }
.prog-chevron { color:var(--text-faint); font-size:12px; transition:transform .2s; flex-shrink:0; }
.prog-group-card.open .prog-chevron { transform:rotate(180deg); }
.prog-group-body { display:none; }
.prog-group-card.open .prog-group-body { display:block; }
.prog-heat-label {
  font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-faint); padding:8px 14px 2px;
}
.prog-skater-row {
  display:flex; align-items:center; gap:10px;
  padding:9px 14px; border-bottom:1px solid var(--divider);
}
.prog-skater-row:last-child { border-bottom:none; }
.prog-bib { font-size:12px; color:var(--text-faint); min-width:36px; flex-shrink:0; font-family:monospace; }
.prog-skater-name { font-size:15px; color:var(--text); flex:1; min-width:0; }
.prog-club { font-size:12px; color:var(--text-faint); }
.relay-type-badge {
  font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ice); background:rgba(91,184,255,.12);
  padding:2px 7px; border-radius:20px; margin-right:4px;
}
.prog-relay-team {
  display:flex; align-items:flex-start; gap:10px;
  padding:10px 14px; border-bottom:1px solid var(--divider);
}
.prog-relay-team:last-child { border-bottom:none; }
.prog-relay-num { font-size:14px; font-weight:700; color:var(--text-faint); min-width:24px; font-family:'Barlow Condensed',sans-serif; flex-shrink:0; }
.prog-relay-info { flex:1; min-width:0; }
.prog-relay-club { font-size:15px; color:var(--text); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.prog-relay-members { font-size:12px; color:var(--text-dim); margin-top:3px; }
.bib-chip { font-size:10px; font-weight:700; padding:1px 8px; border-radius:20px; color:#fff; }

/* ── Waiting / empty states ───────────────────────────────────────────── */
.waiting { padding:48px 24px; text-align:center; }
.wi { font-size:36px; margin-bottom:12px; }
.waiting p { color:var(--text-faint); font-size:15px; }
.empty-state { padding:48px 24px; text-align:center; }
.empty-icon { font-size:36px; margin-bottom:12px; }
.empty-title { font-size:16px; font-weight:600; color:var(--text-dim); margin-bottom:6px; }
.empty-sub { font-size:13px; color:var(--text-faint); }

/* ── Refresh pill ─────────────────────────────────────────────────────── */
.refresh-area { padding:12px; text-align:center; }
.refresh-pill {
  display:inline-flex; align-items:center; gap:6px;
  background:var(--pill-bg); border:1px solid var(--border);
  border-radius:20px; padding:5px 14px;
  font-size:11px; color:var(--text-faint); cursor:pointer;
}
.refresh-pill:hover { background:var(--border); }
.spin { display:inline-block; width:10px; height:10px; border:1.5px solid var(--text-faint); border-top-color:var(--brand); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }

/* ── Event card points badge ──────────────────────────────────────────── */
.pts-badge {
  font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  background:rgba(245,158,11,.12); color:var(--gold);
  padding:2px 7px; border-radius:20px;
}

/* ── qual banner ──────────────────────────────────────────────────────── */
.qual-banner {
  font-size:11px; color:var(--stage-final); font-weight:600;
  padding:6px 14px; text-align:center; letter-spacing:.04em;
  border-top:1px solid var(--divider);
}

/* ── lineup placeholder ───────────────────────────────────────────────── */
.lineup-placeholder {
  padding:14px; text-align:center;
  font-size:13px; color:var(--text-faint);
}
</style>
</head>
<body>
<div class="app-shell">

  <!-- ── Header ────────────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="header-top">
      <div class="header-identity">
        <div class="header-logo">PW<span class="slash">/</span>TAB</div>
        <div class="header-comp">{{comp.name}}</div>
      </div>
      <div class="header-actions">
        <div class="live-pill"><span class="live-dot"></span>LIVE</div>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle theme">
          <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </button>
      </div>
    </div>
    <nav class="tab-bar" role="tablist">
      <button class="tab-btn active" id="tab-results" onclick="setTab('results')" role="tab">
        <span class="tab-icon">🏅</span>
        <span class="tab-label">Results</span>
      </button>
      <button class="tab-btn" id="tab-search" onclick="setTab('search')" role="tab">
        <span class="tab-icon">🔍</span>
        <span class="tab-label">Search</span>
      </button>
      <button class="tab-btn" id="tab-schedule" onclick="setTab('schedule')" role="tab">
        <span class="tab-icon">📋</span>
        <span class="tab-label">Schedule</span>
      </button>
      <button class="tab-btn" id="tab-program" onclick="setTab('program')" role="tab">
        <span class="tab-icon">👥</span>
        <span class="tab-label">Program</span>
      </button>
    </nav>
  </header>

  <!-- ── Search bar (only shown in Search tab) ─────────────────────── -->
  <div id="searchWrap" class="search-wrap hidden">
    <div class="search-inner">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="search" id="searchInput" placeholder="Search athlete name…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" oninput="onSearchInput(this.value)">
      <button class="search-clear" id="searchClear" onclick="clearSearchInput()" aria-label="Clear">✕</button>
    </div>
  </div>

  <!-- ── Main content ───────────────────────────────────────────────── -->
  <main class="content-area">
    <div id="view-results" class="view active">
      <div class="content-pad" id="results-content">
        <div class="waiting"><div class="wi">⏳</div><p>Loading…</p></div>
      </div>
    </div>
    <div id="view-search" class="view">
      <div class="content-pad" id="search-content">
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <div class="empty-title">Search for an athlete</div>
          <div class="empty-sub">Type a name above to see results &amp; program</div>
        </div>
      </div>
    </div>
    <div id="view-schedule" class="view">
      <div class="content-pad" id="schedule-content">
        <div class="waiting"><div class="wi">⏳</div><p>Loading…</p></div>
      </div>
    </div>
    <div id="view-program" class="view">
      <div class="content-pad" id="program-content">
        <div class="waiting"><div class="wi">⏳</div><p>Loading…</p></div>
      </div>
    </div>
  </main>

</div><!-- /.app-shell -->

<script>
// ── Jinja injection ──────────────────────────────────────────────────────────
const COMP_ID = {{comp.id}};

// ── State ────────────────────────────────────────────────────────────────────
let allGroups   = {};   // {groupName: {skater_count: N}}
let allRelays   = {};   // {evName: {heats,semis,finals}}
let allGroupData= {};   // {groupName: {evName: {heats,semis,finals,...}}}
let curTab      = 'results';
let timer       = null;
let searchTimer = null;
let scheduleLoaded = false;

// ── Theme ────────────────────────────────────────────────────────────────────
(function applyTheme() {
  try {
    const saved = localStorage.getItem('pw_theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const dark = saved ? saved === 'dark' : prefersDark;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    updateThemeIcon(dark);
  } catch(e) {}
})();

function toggleTheme() {
  const isDark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
  try { localStorage.setItem('pw_theme', isDark ? 'light' : 'dark'); } catch(e) {}
  updateThemeIcon(!isDark);
}

function updateThemeIcon(isDark) {
  const icon = document.getElementById('themeIcon');
  if (!icon) return;
  if (isDark) {
    // Sun icon (switch to light)
    icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
  } else {
    // Moon icon (switch to dark)
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
}

// ── Tab switching ────────────────────────────────────────────────────────────
function setTab(tab) {
  curTab = tab;
  // Update tab buttons
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  // Show/hide views
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(`view-${tab}`).classList.add('active');
  // Show/hide search bar
  const searchWrap = document.getElementById('searchWrap');
  searchWrap.classList.toggle('hidden', tab !== 'search');
  if (tab === 'search') {
    document.getElementById('searchInput').focus();
  }
  // Persist state
  savePubState();
  // Render if needed
  if (tab === 'results') renderResults();
  if (tab === 'schedule') renderSchedulePublic();
  if (tab === 'program') renderProgram();
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function setView(viewId, html) {
  const el = document.getElementById(viewId);
  if (el) el.innerHTML = html || '<div class="waiting"><div class="wi">⏳</div><p>No data</p></div>';
}

function esc(s) { return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function timestamp() { return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function waiting(msg) { return `<div class="waiting"><div class="wi">⏳</div><p>${msg}</p></div>`; }

// ── State persistence ────────────────────────────────────────────────────────
const PUB_STATE_KEY = `pw_pub_state_${COMP_ID}`;
function savePubState() {
  try { localStorage.setItem(PUB_STATE_KEY, JSON.stringify({ tab: curTab })); } catch(e) {}
}
function loadPubState() {
  try { return JSON.parse(localStorage.getItem(PUB_STATE_KEY)); } catch(e) { return null; }
}

// ── Data loading ─────────────────────────────────────────────────────────────
async function loadGroupData(group) {
  if (allGroupData[group]) return;
  try {
    const r = await fetch(`/api/${COMP_ID}/group/${encodeURIComponent(group)}`);
    allGroupData[group] = await r.json();
  } catch(e) { allGroupData[group] = {}; }
}

// ── Results tab ──────────────────────────────────────────────────────────────
async function renderResults() {
  const groups = Object.keys(allGroups).sort();
  if (!groups.length && !Object.keys(allRelays).length) {
    setView('results-content', '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">No groups yet</div><div class="empty-sub">Check back soon!</div></div>');
    return;
  }

  // Load all groups in parallel
  await Promise.all(groups.map(g => loadGroupData(g)));

  const ORDER = ['Short Distance', 'Medium Distance', 'Long Distance'];
  let html = '';

  for (const group of groups) {
    const events = allGroupData[group] || {};
    const evNames = Object.keys(events).filter(n => n !== '__standings__');
    if (!evNames.length) continue;

    const ordered = [
      ...ORDER.filter(n => evNames.includes(n)),
      ...evNames.filter(n => !ORDER.includes(n))
    ];

    const skaterCount = allGroups[group]?.skater_count ?? allGroups[group] ?? '';
    html += `<div class="group-label">Group ${group}${skaterCount ? ` · ${skaterCount} skaters` : ''}</div>`;

    for (const evName of ordered) {
      const ev = events[evName];
      if (!ev) continue;
      const cardId = `ev-${esc(group)}-${esc(evName)}`;
      const pills  = buildStagePills(ev);
      const isPoints = ev.points_event;
      html += `<div class="ev-card" id="${cardId}">
        <div class="ev-head" onclick="toggleEvCard('${cardId}')">
          <div class="ev-head-left">
            <div class="ev-name">${evName}</div>
            <div class="ev-meta">Group ${group}${isPoints ? ' · 🏆 Points' : ''}</div>
          </div>
          <div class="ev-head-right">
            <div class="stage-pills">${pills}</div>
            <span class="ev-chevron">▼</span>
          </div>
        </div>
        <div class="ev-body" id="body-${cardId}">
          ${buildEvBody(ev, group)}
        </div>
      </div>`;
    }

    // Standings card if this group has points events
    const hasPoints = Object.values(events).some(e => e && e.points_event);
    if (hasPoints) {
      html += `<div id="standings-${esc(group)}"></div>`;
    }
  }

  // Relay section
  const relayNames = Object.keys(allRelays).sort();
  if (relayNames.length) {
    html += `<div class="relay-section-label">🔄 Relay Events</div>`;
    for (const name of relayNames) {
      const ev = allRelays[name];
      const cardId = `relay-${esc(name)}`;
      const pills  = buildStagePills(ev);
      html += `<div class="relay-card" id="${cardId}">
        <div class="relay-head" onclick="toggleEvCard('${cardId}')">
          <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
            <span class="relay-badge">Relay</span>
            <span class="relay-name">${name}</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            <div class="stage-pills">${pills}</div>
            <span class="ev-chevron">▼</span>
          </div>
        </div>
        <div class="relay-body" id="body-${cardId}">
          ${buildRelayBody(ev)}
        </div>
      </div>`;
    }
  }

  // Refresh pill at the bottom
  html += `<div class="refresh-area">
    <div class="refresh-pill" onclick="doRefresh(true)">
      <span class="spin"></span>
      <span id="last-upd">Updated —</span>
    </div>
  </div>`;

  setView('results-content', html);
  document.getElementById('last-upd').textContent = 'Updated ' + timestamp();

  // Load standings for groups with points
  for (const group of groups) {
    const events = allGroupData[group] || {};
    const hasPoints = Object.values(events).some(e => e && e.points_event);
    if (hasPoints) {
      loadStandingsInline(group);
    }
  }
}

function buildStagePills(ev) {
  const pills = [];
  if (!ev) return '';
  if (ev.type === 'direct_final') {
    pills.push('<span class="stage-pill sp-direct">Direct</span>');
  } else {
    if (ev.heats?.some(h => h.skaters?.length || h.teams?.length))  pills.push('<span class="stage-pill sp-heat">Heat</span>');
    if (ev.semis?.some(h => h.skaters?.length || h.teams?.length))  pills.push('<span class="stage-pill sp-semi">Semi</span>');
    if (ev.finals?.some(h => h.skaters?.length || h.teams?.length)) pills.push('<span class="stage-pill sp-final">Final</span>');
  }
  if (!pills.length) pills.push('<span class="stage-pill sp-heat" style="opacity:.4">TBD</span>');
  return pills.join('');
}

function buildEvBody(ev, group) {
  let html = '';
  if (!ev) return waiting('No data');

  if (ev.type === 'direct_final') {
    html += `<div class="direct-pill">🏁 DIRECT FINAL</div>`;
    html += (ev.finals || []).map(h => h.skaters?.length ? hCard(h, 'fh') : waiting('Not yet started')).join('');
    return html;
  }

  const finalHasResults = ev.finals?.some(h => h.skaters?.some(s => s.placement));
  const finalHasSkaters = ev.finals?.some(h => h.skaters?.length);
  const semiHasSkaters  = ev.semis?.some(h => h.skaters?.length);
  const heatHasSkaters  = ev.heats?.some(h => h.skaters?.length);

  if (finalHasResults || finalHasSkaters) {
    html += `<div class="slbl fn">Final</div>`;
    html += ev.finals.map(h => h.skaters?.length ? hCard(h,'fh') : waiting('Final lineup coming soon')).join('');
    if (semiHasSkaters) {
      html += `<div class="slbl sm" style="margin-top:4px">Semi-Finals</div>`;
      html += ev.semis.map(h => h.skaters?.length ? hCard(h,'sh') : '').join('');
    }
    if (heatHasSkaters) {
      html += `<div class="slbl ht" style="margin-top:4px">Heats</div>`;
      html += ev.heats.map(h => h.skaters?.length ? hCard(h,'hh') : '').join('');
    }
  } else if (semiHasSkaters) {
    html += `<div class="slbl sm">Semi-Finals</div>`;
    html += ev.semis.map(h => hCard(h,'sh')).join('');
    html += `<div class="slbl fn" style="margin-top:4px">Final</div>`;
    html += ev.finals.map(() => waiting('Final lineup coming soon')).join('');
    if (heatHasSkaters) {
      html += `<div class="slbl ht" style="margin-top:4px">Heats</div>`;
      html += ev.heats.map(h => h.skaters?.length ? hCard(h,'hh') : '').join('');
    }
  } else if (heatHasSkaters) {
    html += `<div class="slbl ht">Heats</div>`;
    html += ev.heats.map(h => hCard(h,'hh')).join('');
    const adv = semiHasSkaters || finalHasSkaters;
    if (adv) html += `<div class="qual-banner">✓ Qualifiers advanced</div>`;
  } else {
    if (ev.heats?.length) {
      html += `<div class="slbl ht">Heats</div>`;
      html += ev.heats.map(h => hCard(h,'hh')).join('');
    } else if (ev.finals?.length) {
      html += `<div class="slbl fn">Final</div>`;
      html += ev.finals.map(h => hCard(h,'fh')).join('');
    } else {
      html = waiting('No heats seeded yet');
    }
  }
  return html;
}

function buildRelayBody(ev) {
  if (!ev) return waiting('No relay data');
  const COLORS = {green:'#2E7D32',blue:'#1565C0',yellow:'#F9A825',pink:'#E91E8C','light blue':'#29B6F6',black:'#212121',red:'#C62828'};

  const relayHCard = (heat, cls) => {
    const label = heat.stage==='Final' ? 'FINAL' : `${heat.stage.toUpperCase()} ${heat.number}`;
    const sorted = [...(heat.teams||[])].sort((a,b) => {
      const pa = /^\d+$/.test(a.placement) ? parseInt(a.placement) : 999;
      const pb = /^\d+$/.test(b.placement) ? parseInt(b.placement) : 999;
      return pa - pb;
    });
    if (!sorted.length) return `<div class="hcard"><div class="hcard-head ${cls}"><h3>${label}</h3><span class="sc">0 TEAMS</span></div><div class="lineup-placeholder">Waiting for lineup</div></div>`;
    const rows = sorted.map((t, i) => {
      const pl = t.placement, num = parseInt(pl), ranked = !isNaN(num);
      const pcls = num===1?'p1':num===2?'p2':num===3?'p3':'pn';
      const bibColor = COLORS[t.color?.toLowerCase()] || '#546E7A';
      const memberList = (t.members||[]).filter(m=>m&&m!=='nan').join(', ');
      const plEl = pl==='DQ'
        ? `<div class="sk-place"><span class="place-dq">DQ</span></div>`
        : ranked ? `<div class="sk-place"><div class="place-num ${pcls}">${pl}</div></div>`
        : `<div class="sk-place"><div class="place-wait">—</div></div>`;
      return `<div class="sk-row${num===1?' r1':num===2?' r2':num===3?' r3':''}" style="animation-delay:${i*.04}s">
        <div class="rank-num ${ranked?pcls:'rn'}">${ranked?num:i+1}</div>
        <div class="sk-info">
          <div class="sk-name" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span>${t.club}</span>
            <span class="bib-chip" style="background:${bibColor}">${t.color||''}</span>
          </div>
          ${memberList?`<div class="sk-meta">${memberList}</div>`:''}
        </div>${plEl}
      </div>`;
    }).join('');
    return `<div class="hcard"><div class="hcard-head ${cls}"><h3>${label}</h3><span class="sc">${sorted.length} TEAMS</span></div>${rows}</div>`;
  };

  const finalHasResults = ev.finals?.some(h=>h.teams?.some(t=>t.placement));
  const finalHasTeams   = ev.finals?.some(h=>h.teams?.length);
  const semiHasTeams    = ev.semis?.some(h=>h.teams?.length);
  let html = '';

  if (finalHasResults || finalHasTeams) {
    html += `<div class="slbl fn">Final</div>` + ev.finals.map(h=>relayHCard(h,'fh')).join('');
    if (ev.semis?.some(h=>h.teams?.length)) {
      html += `<div class="slbl sm" style="margin-top:4px">Semi-Finals</div>` + ev.semis.map(h=>relayHCard(h,'sh')).join('');
    }
    if (ev.heats?.some(h=>h.teams?.length)) {
      html += `<div class="slbl ht" style="margin-top:4px">Heats</div>` + ev.heats.map(h=>relayHCard(h,'hh')).join('');
    }
  } else if (semiHasTeams) {
    html += `<div class="slbl sm">Semi-Finals</div>` + ev.semis.map(h=>relayHCard(h,'sh')).join('');
    html += `<div class="slbl fn" style="margin-top:4px">Final</div>` + ev.finals.map(()=>waiting('Final lineup coming soon')).join('');
    if (ev.heats?.some(h=>h.teams?.length)) {
      html += `<div class="slbl ht" style="margin-top:4px">Heats</div>` + ev.heats.map(h=>relayHCard(h,'hh')).join('');
    }
  } else if (ev.heats?.length) {
    html += `<div class="slbl ht">Heats</div>` + ev.heats.map(h=>relayHCard(h,'hh')).join('');
  } else {
    html = waiting('No results yet');
  }
  return html;
}

function toggleEvCard(cardId) {
  const card = document.getElementById(cardId);
  if (card) card.classList.toggle('open');
}

// ── Heat card ────────────────────────────────────────────────────────────────
function hCard(heat, hdrCls) {
  const label = heat.stage==='Final' ? 'FINAL' : `${heat.stage.toUpperCase()} ${heat.number}`;
  const sorted = [...(heat.skaters||[])].sort((a,b) => {
    const pa = /^\d+$/.test(a.placement) ? parseInt(a.placement) : 999;
    const pb = /^\d+$/.test(b.placement) ? parseInt(b.placement) : 999;
    return pa - pb;
  });
  const rows = sorted.map((s,i) => {
    const pl = s.placement, num = parseInt(pl), ranked = !isNaN(num);
    const rc  = num===1?' r1':num===2?' r2':num===3?' r3':'';
    const pcls = num===1?'p1':num===2?'p2':num===3?'p3':'pn';
    const plEl = pl==='DQ'
      ? `<div class="sk-place"><span class="place-dq">DQ</span></div>`
      : ranked ? `<div class="sk-place"><div class="place-num ${pcls}">${pl}</div></div>`
      : `<div class="sk-place"><div class="place-wait">—</div></div>`;
    return `<div class="sk-row${rc}" style="animation-delay:${i*.04}s">
      <div class="rank-num ${ranked?pcls:'rn'}">${ranked?num:i+1}</div>
      <div class="sk-info">
        <div class="sk-name">${s.full_name}</div>
        <div class="sk-meta">#${s.panel} · ${s.club}</div>
      </div>${plEl}
    </div>`;
  }).join('');
  return `<div class="hcard">
    <div class="hcard-head ${hdrCls}"><h3>${label}</h3><span class="sc">${sorted.length} SKATERS</span></div>
    ${rows || '<div class="lineup-placeholder">Waiting for lineup</div>'}
  </div>`;
}

// ── Standings (inline in Results) ────────────────────────────────────────────
async function loadStandingsInline(group) {
  const container = document.getElementById(`standings-${esc(group)}`);
  if (!container) return;
  try {
    const r = await fetch(`/api/${COMP_ID}/standings/${encodeURIComponent(group)}`);
    const d = await r.json();
    const data = d.standings || [], tbEv = d.tiebreaker_event || '';
    if (!data.length) return;
    const rows = data.map(row => {
      const pos = row.position;
      const pcls = pos===1?'p1':pos===2?'p2':pos===3?'p3':'pn';
      const rc   = pos===1?' r1':pos===2?' r2':pos===3?' r3':'';
      const bd = Object.entries(row.breakdown||{}).map(([ev,info]) => {
        const s = ['st','nd','rd'][info.place-1]||'th';
        const ptsStr = info.pts > 0 ? ` ${info.pts}pts` : '';
        return `${ev.replace(' Distance','')}: ${info.place}${s}${ptsStr}${ev===tbEv?' ⚖':''}`;
      }).join(' · ');
      const tie = row.tb_needed ? '<span class="tie-badge">TIE</span>' : '';
      const medal = {1:'🥇',2:'🥈',3:'🥉'}[pos] || '';
      const ptsDisplay = row.points > 0 ? row.points : '—';
      return `<div class="standings-row${rc}">
        <div class="st-pos ${pcls}">${medal||pos}</div>
        <div class="st-info">
          <div class="st-name">${row.name}${tie}</div>
          ${bd?`<div class="st-breakdown">${bd}</div>`:''}
        </div>
        <div><div class="st-pts">${ptsDisplay}</div><div class="st-pts-label">PTS</div></div>
      </div>`;
    }).join('');
    container.innerHTML = `<div class="standings-card">
      <div class="standings-head">
        <h3>🏆 Standings — ${group}</h3>
        <span class="standings-pts-key">1ST=30 · 2ND=20 · 3RD=10 · 4TH=5</span>
      </div>${rows}</div>
      ${tbEv?`<div style="font-size:11px;color:var(--text-faint);text-align:center;padding:6px">⚖ Tiebreaker: ${tbEv}</div>`:''}`;
  } catch(e) {}
}

// ── Schedule tab ─────────────────────────────────────────────────────────────
async function renderSchedulePublic() {
  setView('schedule-content', waiting('Loading schedule…'));
  try {
    const r   = await fetch(`/api/comp/${COMP_ID}/schedule`);
    const evs = await r.json().catch(() => []);
    if (!evs.length) {
      setView('schedule-content', '<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">No schedule yet</div><div class="empty-sub">Check back soon</div></div>');
      return;
    }

    let html = ''; let curSection = ''; let sectionOpen = false;

    evs.forEach(ev => {
      if (ev.section !== curSection) {
        if (sectionOpen) html += '</div>';
        curSection = ev.section;
        sectionOpen = true;
        html += `<div class="sched-section">
          <div class="sched-section-hdr">
            <span class="sched-section-time">${ev.section_time||''}</span>
            <span class="sched-section-name">${ev.section}</span>
          </div>`;
      }
      const statusBadge = ev.status === 'done'
        ? `<span class="sched-badge done">Done</span>`
        : ev.status === 'in_progress'
          ? `<span class="sched-badge in_progress"><span class="sched-live-dot"></span>Live</span>`
          : ev.status === 'next'
            ? `<span class="sched-badge next">Up Next</span>`
            : `<span class="sched-badge pending">Upcoming</span>`;
      html += `<div class="sched-row ${ev.status||''}">
        <div class="sched-num">${ev.race_number}</div>
        <div class="sched-info">
          <div class="sched-label">${ev.label}</div>
          <div class="sched-meta">${ev.stage}${ev.distance?' · '+ev.distance:''}${ev.note?' · '+ev.note:''}</div>
        </div>
        ${statusBadge}
      </div>`;
    });
    if (sectionOpen) html += '</div>';
    if (!html.replace(/<[^>]+>/g,'').trim()) {
      html = '<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-title">All events completed!</div></div>';
    }
    setView('schedule-content', html);
  } catch(e) {
    setView('schedule-content', `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Could not load schedule</div></div>`);
  }
}

// ── Program tab ──────────────────────────────────────────────────────────────
async function renderProgram() {
  setView('program-content', waiting('Loading program…'));

  const groups = Object.keys(allGroups).sort();
  await Promise.all(groups.map(g => loadGroupData(g)));

  let html = '';

  for (const group of groups) {
    const events = allGroupData[group] || {};
    const skaterCount = allGroups[group]?.skater_count ?? allGroups[group] ?? '';
    const cardId = `prog-${esc(group)}`;

    const body = buildProgGroupBody(group, events);
    html += `<div class="prog-group-card" id="${cardId}">
      <div class="prog-group-hdr" onclick="toggleProgCard('${cardId}')">
        <span class="prog-group-name">${group}<span class="prog-group-count">${skaterCount ? `${skaterCount} skaters` : ''}</span></span>
        <span class="prog-chevron">▼</span>
      </div>
      <div class="prog-group-body">${body}</div>
    </div>`;
  }

  const relayNames = Object.keys(allRelays).sort();
  for (const name of relayNames) {
    const ev = allRelays[name];
    const cardId = `prog-relay-${esc(name)}`;
    const body = buildProgRelayBody(ev);
    html += `<div class="prog-group-card" id="${cardId}">
      <div class="prog-group-hdr" onclick="toggleProgCard('${cardId}')" style="background:rgba(91,184,255,.07)">
        <div>
          <span class="relay-type-badge">Relay</span>
          <span class="prog-group-name">${name}</span>
        </div>
        <span class="prog-chevron">▼</span>
      </div>
      <div class="prog-group-body">${body}</div>
    </div>`;
  }

  if (!html) {
    html = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">No program yet</div></div>';
  }

  setView('program-content', html);
}

function buildProgGroupBody(group, events) {
  const ORDER = ['Short Distance', 'Medium Distance', 'Long Distance'];
  const evNames = Object.keys(events).filter(n => n !== '__standings__');
  const firstEv = ORDER.find(n => evNames.includes(n)) || evNames.find(n => n !== '__standings__');
  if (!firstEv || !events[firstEv]) return '<div class="lineup-placeholder">No heats seeded yet</div>';

  const ev = events[firstEv];
  const stages = ev.heats?.length
    ? ev.heats.map(h => ({...h, _label:`Heat ${h.number}`}))
    : ev.finals?.map(h => ({...h, _label:'Final'})) || [];

  if (!stages.length) return '<div class="lineup-placeholder">No lineup yet</div>';

  return stages.map(h => {
    const skaters = h.skaters || [];
    if (!skaters.length) return `<div class="prog-heat-label">${h._label}</div><div class="lineup-placeholder">No skaters assigned</div>`;
    return `<div class="prog-heat-label">${h._label}</div>` +
      skaters.map(s =>
        `<div class="prog-skater-row">
          <span class="prog-bib">#${s.panel}</span>
          <span class="prog-skater-name">${s.full_name}</span>
          <span class="prog-club">${s.club}</span>
        </div>`
      ).join('');
  }).join('');
}

function buildProgRelayBody(ev) {
  if (!ev) return '<div class="lineup-placeholder">No relay data</div>';
  const COLORS = {green:'#2E7D32',blue:'#1565C0',yellow:'#F9A825',pink:'#E91E8C','light blue':'#29B6F6',black:'#212121',red:'#C62828'};

  const stages = ev.heats?.length
    ? ev.heats.map(h => ({...h, _label:`Heat ${h.number}`}))
    : ev.finals?.map(h => ({...h, _label:'Final'})) || [];

  if (!stages.length) return '<div class="lineup-placeholder">No lineup yet</div>';

  return stages.map(h => {
    const teams = h.teams || [];
    if (!teams.length) return `<div class="prog-heat-label">${h._label}</div><div class="lineup-placeholder">Lineup not posted</div>`;
    return `<div class="prog-heat-label">${h._label}</div>` +
      teams.map((t, i) => {
        const bibColor = COLORS[t.color?.toLowerCase()] || '#9E9E9E';
        const members = (t.members||[]).filter(m=>m&&m!=='nan');
        return `<div class="prog-relay-team">
          <div class="prog-relay-num">${i+1}</div>
          <div class="prog-relay-info">
            <div class="prog-relay-club">
              ${t.club}
              <span class="bib-chip" style="background:${bibColor}">${t.color||''}</span>
            </div>
            ${members.length ? `<div class="prog-relay-members">${members.join(' · ')}</div>` : ''}
          </div>
        </div>`;
      }).join('');
  }).join('');
}

function toggleProgCard(cardId) {
  const card = document.getElementById(cardId);
  if (card) card.classList.toggle('open');
}

// ── Search tab ───────────────────────────────────────────────────────────────
let searchTimer2 = null;
function onSearchInput(val) {
  const q = val.trim().toLowerCase();
  const clearBtn = document.getElementById('searchClear');
  clearBtn.classList.toggle('visible', q.length > 0);
  clearTimeout(searchTimer2);
  if (!q) {
    setView('search-content', `<div class="empty-state">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">Search for an athlete</div>
      <div class="empty-sub">Type a name above to see results &amp; program</div>
    </div>`);
    return;
  }
  searchTimer2 = setTimeout(() => doUnifiedSearch(q), 300);
}

function clearSearchInput() {
  const input = document.getElementById('searchInput');
  input.value = '';
  document.getElementById('searchClear').classList.remove('visible');
  setView('search-content', `<div class="empty-state">
    <div class="empty-icon">🔍</div>
    <div class="empty-title">Search for an athlete</div>
    <div class="empty-sub">Type a name above to see results &amp; program</div>
  </div>`);
  input.focus();
}

async function doUnifiedSearch(q) {
  setView('search-content', waiting('Searching…'));

  // Ensure all group data loaded
  const groups = Object.keys(allGroups).sort();
  await Promise.all(groups.filter(g => !allGroupData[g]).map(g => loadGroupData(g)));

  const ORDER = ['Short Distance', 'Medium Distance', 'Long Distance'];
  const COLORS = {green:'#2E7D32',blue:'#1565C0',yellow:'#F9A825',pink:'#E91E8C','light blue':'#29B6F6',black:'#212121',red:'#C62828'};

  // --- Individual skater results (all stages) ---
  // bySkater: { `panel_name` => { name, panel, club, races: [{event, group, stage, number, placement}] } }
  const bySkater = {};

  for (const group of groups) {
    const events = allGroupData[group] || {};
    for (const [evName, ev] of Object.entries(events)) {
      if (evName === '__standings__' || !ev) continue;
      const allHeats = [
        ...(ev.heats||[]).map(h=>({...h,_stage:'Heat'})),
        ...(ev.semis||[]).map(h=>({...h,_stage:'Semi'})),
        ...(ev.finals||[]).map(h=>({...h,_stage:'Final'})),
      ];
      for (const heat of allHeats) {
        for (const s of (heat.skaters||[])) {
          if (!s.full_name?.toLowerCase().includes(q) && !(s.panel||'').toLowerCase().includes(q)) continue;
          const key = `${s.panel}_${s.full_name}`;
          if (!bySkater[key]) bySkater[key] = { name: s.full_name, panel: s.panel, club: s.club, races: [] };
          bySkater[key].races.push({
            event: evName, group, stage: heat._stage,
            number: heat.number, placement: s.placement || ''
          });
        }
      }
    }
  }

  // --- Relay teams ---
  const relayMatches = [];
  for (const [evName, ev] of Object.entries(allRelays)) {
    const allStages = [
      ...(ev.heats||[]).map(h=>({...h,_stage:'Heat'})),
      ...(ev.semis||[]).map(h=>({...h,_stage:'Semi'})),
      ...(ev.finals||[]).map(h=>({...h,_stage:'Final'})),
    ];
    for (const heat of allStages) {
      for (const t of (heat.teams||[])) {
        const members = (t.members||[]).filter(m=>m&&m!=='nan');
        const memberMatch = members.some(m => m?.toLowerCase().includes(q));
        const clubMatch   = t.club?.toLowerCase().includes(q);
        if (!memberMatch && !clubMatch) continue;
        relayMatches.push({
          evName, stage: heat._stage, number: heat.number,
          club: t.club, color: t.color, members,
          placement: t.placement || ''
        });
      }
    }
  }

  const skaterKeys = Object.keys(bySkater);
  if (!skaterKeys.length && !relayMatches.length) {
    setView('search-content', `<div class="empty-state">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">No results for "${q}"</div>
      <div class="empty-sub">Try a different name or bib number</div>
    </div>`);
    return;
  }

  const stageRank = {Heat:1, Semi:2, Final:3};
  let html = `<div class="sr-count">${skaterKeys.length + relayMatches.length} match${skaterKeys.length+relayMatches.length!==1?'es':''} for "${q}"</div>`;

  // Individual athlete cards
  for (const key of skaterKeys) {
    const sk = bySkater[key];
    // Sort races by event name then stage progression
    sk.races.sort((a,b) => {
      if (a.event !== b.event) return a.event.localeCompare(b.event);
      return (stageRank[a.stage]||0) - (stageRank[b.stage]||0);
    });

    const rows = sk.races.map(r => {
      const num = parseInt(r.placement);
      const ranked = !isNaN(num);
      const pcls = num===1?'p1':num===2?'p2':num===3?'p3':'pn';
      const plEl = r.placement === 'DQ'
        ? `<span class="place-dq">DQ</span>`
        : ranked
          ? `<div class="sr-place ${pcls}">${r.placement}</div>`
          : `<div class="sr-place pending">—</div>`;
      return `<div class="sr-row">
        <div>
          <div class="sr-ev-name">${r.event}</div>
          <div class="sr-ev-meta">${r.group} · ${r.stage}${r.stage!=='Final'?' '+r.number:''}</div>
        </div>
        ${plEl}
      </div>`;
    }).join('');

    html += `<div class="sr-card">
      <div class="sr-skater-head">
        <div>
          <div class="sr-skater-name">${sk.name}</div>
          <div class="sr-skater-meta">#${sk.panel} · ${sk.club}</div>
        </div>
      </div>
      ${rows}
    </div>`;
  }

  // Relay cards
  for (const r of relayMatches) {
    const num = parseInt(r.placement);
    const ranked = !isNaN(num);
    const pcls = num===1?'p1':num===2?'p2':num===3?'p3':'pn';
    const plEl = r.placement === 'DQ'
      ? `<span class="place-dq">DQ</span>`
      : ranked
        ? `<div class="sr-place ${pcls}">${r.placement}</div>`
        : `<div class="sr-place pending">—</div>`;
    const bibColor = COLORS[(r.color||'').toLowerCase()] || '#9E9E9E';
    html += `<div class="sr-card">
      <div class="sr-skater-head">
        <div>
          <div class="sr-skater-name" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span>🔄 ${r.club}</span>
            <span class="bib-chip" style="background:${bibColor}">${r.color||''}</span>
          </div>
          <div class="sr-skater-meta">${r.members.join(' · ')}</div>
        </div>
      </div>
      <div class="sr-row">
        <div>
          <div class="sr-ev-name">${r.evName}</div>
          <div class="sr-ev-meta">${r.stage}${r.stage!=='Final'?' '+r.number:''}</div>
        </div>
        ${plEl}
      </div>
    </div>`;
  }

  setView('search-content', html);
}

// ── Auto-refresh ─────────────────────────────────────────────────────────────
async function doRefresh(isManual = false) {
  try {
    // Re-fetch relay data
    const rr = await fetch(`/api/${COMP_ID}/relays`).catch(() => null);
    if (rr?.ok) allRelays = await rr.json().catch(() => allRelays);

    if (curTab === 'results') {
      // Clear cached group data to force reload
      if (isManual) {
        allGroupData = {};
        await renderResults();
      } else {
        // Incremental: just re-fetch data for groups already loaded
        const loaded = Object.keys(allGroupData);
        await Promise.all(loaded.map(async g => {
          try {
            const r2 = await fetch(`/api/${COMP_ID}/group/${encodeURIComponent(g)}`);
            allGroupData[g] = await r2.json();
          } catch(e) {}
        }));
        await renderResults();
      }
    } else if (curTab === 'schedule') {
      if (isManual) renderSchedulePublic();
    } else if (curTab === 'program') {
      allGroupData = {};
      await renderProgram();
    }

    const upd = document.getElementById('last-upd');
    if (upd) upd.textContent = 'Updated ' + timestamp();
  } catch(e) {
    console.warn('Refresh error:', e);
  }
}

// ── Boot ─────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const [gr, rr] = await Promise.all([
      fetch(`/api/${COMP_ID}/groups`),
      fetch(`/api/${COMP_ID}/relays`),
    ]);
    allGroups = await gr.json().catch(() => ({}));
    allRelays  = await rr.json().catch(() => ({}));
  } catch(e) {
    try { allGroups = await (await fetch(`/api/${COMP_ID}/groups`)).json(); } catch(e2) {}
  }

  // Restore saved tab
  const state = loadPubState();
  const savedTab = state?.tab;
  if (savedTab && ['results','search','schedule','program'].includes(savedTab)) {
    // Set tab UI without triggering render (we'll render below)
    curTab = savedTab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`tab-${savedTab}`).classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(`view-${savedTab}`).classList.add('active');
    if (savedTab === 'search') document.getElementById('searchWrap').classList.remove('hidden');
  }

  // Render current tab
  if (curTab === 'results')  await renderResults();
  if (curTab === 'schedule') await renderSchedulePublic();
  if (curTab === 'program')  await renderProgram();
  // Search tab: nothing to pre-render

  timer = setInterval(doRefresh, 120000);
}

init();
</script>
