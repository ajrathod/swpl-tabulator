<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>{{comp.name}} — Check-in</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: { colors: { brand: { DEFAULT:'#F4511E', dark:'#BF360C' } },
    fontFamily: { sans: ['Inter','system-ui','-apple-system','sans-serif'] } } }
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',system-ui,sans-serif; background:#F9FAFB; }
  .mono { font-family:'DM Mono',monospace; }
  .ci-btn { border:none; border-radius:20px; padding:5px 14px; font-size:11px; font-weight:600;
    cursor:pointer; font-family:inherit; transition:all .15s; white-space:nowrap; }
  .ci-pending   { background:#F3F4F6; color:#6B7280; }
  .ci-checked_in { background:#DCFCE7; color:#16A34A; }
  .ci-dns       { background:#FEE2E2; color:#DC2626; }
  .name-dns     { text-decoration:line-through; color:#9CA3AF; }

  /* Schedule styles */
  .sched-row { display:flex; align-items:center; gap:12px; padding:12px 16px;
    border-radius:12px; border:1px solid #E5E7EB; background:white; margin-bottom:8px; }
  .sched-row.in_progress { background:rgba(245,158,11,.08); border-color:rgba(245,158,11,.4); }
  .sched-row.done { background:rgba(34,197,94,.07); border-color:rgba(34,197,94,.3); }
  .sched-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px;
    border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap; }
  .sched-badge.pending { background:#F3F4F6; color:#9CA3AF; border:1px solid #E5E7EB; }
  .sched-badge.in_progress { background:rgba(245,158,11,.15); color:#D97706; border:1px solid rgba(245,158,11,.3); }
  .sched-badge.done { background:rgba(34,197,94,.12); color:#16A34A; border:1px solid rgba(34,197,94,.3); }
  .live-dot { width:7px; height:7px; border-radius:50%; background:#F59E0B;
    animation:pulse 1.2s ease-in-out infinite; flex-shrink:0; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
</style>
</head>
<body class="min-h-screen">

<!-- Header -->
<header class="fixed top-0 inset-x-0 z-50 bg-gray-900 h-14 flex items-center px-4 gap-3 shadow-sm">
  <div>
    <div class="text-white font-bold text-sm tracking-wide">SWPL<span class="text-brand">/</span>RACING</div>
    <div class="text-gray-400 text-xs">{{comp.name}}</div>
  </div>
  <div class="ml-auto flex items-center gap-2">
    <span class="bg-brand text-white text-xs font-bold px-2.5 py-1 rounded-full">● LIVE</span>
  </div>
</header>

<!-- Mode bar -->
<div class="fixed top-14 inset-x-0 z-40 bg-white border-b border-gray-200 flex">
  <button id="mode-program" onclick="setMode('program')"
    class="px-5 py-3 text-sm font-500 border-b-2 border-brand text-brand transition">📋 Program</button>
  <button id="mode-schedule" onclick="setMode('schedule')"
    class="px-5 py-3 text-sm font-500 border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition">📅 Schedule</button>
</div>

<!-- Search -->
<div id="search-wrap" class="fixed inset-x-0 z-39 bg-white border-b border-gray-100 px-4 py-2" style="top:calc(56px + 44px);z-index:39">
  <input id="search-inp" type="search" placeholder="Search skater name or panel #…"
    oninput="doSearch(this.value)" autocomplete="off"
    class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-xl outline-none focus:border-brand transition bg-gray-50">
</div>

<!-- Tab bar -->
<div id="tab-bar" class="fixed inset-x-0 z-38 bg-white border-b border-gray-200 overflow-x-auto flex gap-0 scrollbar-hide"
  style="top:calc(56px + 44px + 52px);z-index:38;scrollbar-width:none;-webkit-overflow-scrolling:touch"></div>

<!-- Main content -->
<div id="main-content" class="pt-48 pb-16 px-4 max-w-6xl mx-auto"></div>

<!-- Footer -->
<div class="fixed bottom-0 inset-x-0 bg-white border-t border-gray-200 px-4 py-2.5 flex items-center justify-between z-50">
  <span id="last-upd" class="text-xs text-gray-400">Loading…</span>
  <button onclick="doRefresh()" class="text-xs font-semibold text-brand">↻ Refresh</button>
</div>

<script>
const COMP_ID = {{comp.id}};
const RBIB = {green:'#2E7D32',blue:'#1565C0',yellow:'#F9A825',pink:'#E91E8C','light blue':'#29B6F6',black:'#212121',red:'#C62828'};

let allGroups = {}, allRelays = {}, allGroupData = {}, checkinStatus = {};
let curGroup = null, curMode = 'program', timer = null;

const ts = () => new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function esc(s){ return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function setContent(h){ document.getElementById('main-content').innerHTML = h; }

// ── Check-in ──────────────────────────────────────────────────────────────────
async function loadCheckinStatus() {
  try {
    const r = await fetch(`/api/comp/${COMP_ID}/checkin_status`);
    if (r.ok) checkinStatus = await r.json();
  } catch(e) {}
}

async function toggleCheckin(panel, evName, btn) {
  const key = `${panel}__${evName}`;
  const cur = checkinStatus[key] || 'pending';
  const next = cur==='pending'?'checked_in':cur==='checked_in'?'dns':'pending';
  checkinStatus[key] = next;
  btn.className = `ci-btn ci-${next}`;
  btn.textContent = next==='pending'?'Check In':next==='checked_in'?'✅ Present':'❌ DNS';
  const nameEl = btn.closest('tr')?.querySelector('.skater-name');
  if (nameEl) nameEl.classList.toggle('name-dns', next==='dns');
  await fetch(`/api/comp/${COMP_ID}/checkin_status`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({panel, event_name:evName, status:next})
  }).catch(()=>{});
}

// ── Mode ──────────────────────────────────────────────────────────────────────
function setMode(mode) {
  curMode = mode;
  const prog = document.getElementById('mode-program');
  const sched = document.getElementById('mode-schedule');
  const search = document.getElementById('search-wrap');
  const tabs = document.getElementById('tab-bar');
  prog.className  = mode==='program'  ? 'px-5 py-3 text-sm font-500 border-b-2 border-brand text-brand transition'
                                      : 'px-5 py-3 text-sm font-500 border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition';
  sched.className = mode==='schedule' ? 'px-5 py-3 text-sm font-500 border-b-2 border-brand text-brand transition'
                                      : 'px-5 py-3 text-sm font-500 border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition';
  search.style.display = mode==='program' ? '' : 'none';
  tabs.style.display   = mode==='program' ? '' : 'none';
  if (mode==='schedule') renderSchedule();
  else if (curGroup) { curGroup.type==='group'?renderGroup(curGroup.key):renderRelay(curGroup.key); }
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function buildTabs() {
  const bar = document.getElementById('tab-bar');
  const groups = Object.keys(allGroups).sort();
  const relays = Object.keys(allRelays).sort();
  const tabCls = (active) => active
    ? 'px-4 py-3 text-sm font-500 border-b-2 border-brand text-brand whitespace-nowrap flex-shrink-0 bg-none border-none cursor-pointer font-sans'
    : 'px-4 py-3 text-sm text-gray-500 border-b-2 border-transparent whitespace-nowrap flex-shrink-0 bg-none border-none cursor-pointer font-sans hover:text-gray-700';
  let html = groups.map(g =>
    `<button id="tab-${CSS.escape(g)}" onclick="selectGroup('${esc(g)}')"
      class="${tabCls(false)}" style="font-family:inherit">${g}</button>`).join('');
  if (relays.length) html += '<div style="width:1px;background:#E5E7EB;margin:8px 0;flex-shrink:0"></div>';
  html += relays.map((name,i) => {
    const short = name.replace(/\(.*?\)/g,'').replace(/Final/gi,'').trim();
    return `<button id="tab-relay-${i}" onclick="selectRelay('${esc(name)}')"
      class="${tabCls(false)}" style="font-family:inherit;max-width:130px;overflow:hidden;text-overflow:ellipsis;font-size:12px"
      title="${name.replace(/"/g,'&quot;')}">🔄 ${short}</button>`;
  }).join('');
  bar.innerHTML = html;
}

function setActiveTab(id) {
  document.querySelectorAll('#tab-bar button').forEach(b => {
    b.style.borderBottomColor = ''; b.style.color = '';
    b.style.borderBottomWidth = '2px'; b.style.borderBottomStyle = 'solid';
    b.style.borderBottomColor = 'transparent'; b.style.color = '#6B7280';
  });
  const el = document.getElementById(id);
  if (el) {
    el.style.borderBottomColor = '#F4511E'; el.style.color = '#F4511E';
    el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  }
}

// ── Heat card (matches operator style) ───────────────────────────────────────
function hCard(heat, colorKey, evName) {
  const label = heat.stage==='Final' ? 'Final' : `${heat.stage} ${heat.number}`;
  const hdrs  = {heat:'bg-blue-600', semi:'bg-purple-600', final:'bg-yellow-500'};
  const hdrBg = hdrs[colorKey] || 'bg-gray-600';
  const skaters = heat.skaters || [];
  const count = skaters.length;

  if (!count) return `
    <div class="bg-white rounded-xl shadow-sm overflow-hidden flex-1 min-w-64 max-w-sm border border-gray-100">
      <div class="${hdrBg} px-4 py-2.5 flex items-center justify-between">
        <span class="text-white text-sm font-bold">${label}</span>
        <span class="text-white/70 text-xs">0 skaters</span>
      </div>
      <div class="p-6 text-center text-gray-400 text-sm">No skaters assigned</div>
    </div>`;

  const rows = skaters.map((s,i) => {
    const key = `${s.panel}__${evName}`;
    const status = checkinStatus[key] || 'pending';
    const btnLabel = status==='pending'?'Check In':status==='checked_in'?'✅ Present':'❌ DNS';
    return `<tr class="border-b border-gray-50 hover:bg-gray-50 transition">
      <td class="px-3 py-2.5 text-xs text-gray-400 w-6">${i+1}</td>
      <td class="px-3 py-2.5">
        <span class="skater-name text-sm${status==='dns'?' name-dns':''}">${s.full_name}</span>
      </td>
      <td class="px-3 py-2.5 text-xs mono text-gray-400">${s.panel}</td>
      <td class="px-3 py-2.5 text-xs text-gray-400">${s.club}</td>
      <td class="px-3 py-2.5">
        <button class="ci-btn ci-${status}"
          onclick="toggleCheckin('${esc(s.panel)}','${esc(evName)}',this)">${btnLabel}</button>
      </td>
    </tr>`;
  }).join('');

  return `<div class="bg-white rounded-xl shadow-sm overflow-hidden flex-1 min-w-64 border border-gray-100">
    <div class="${hdrBg} px-4 py-2.5 flex items-center justify-between">
      <span class="text-white text-sm font-bold">${label}</span>
      <span class="text-white/70 text-xs">${count} skaters</span>
    </div>
    <table class="w-full">
      <thead><tr class="border-b border-gray-100 bg-gray-50 text-xs font-semibold text-gray-400 uppercase tracking-wider">
        <th class="px-3 py-2">#</th>
        <th class="px-3 py-2 text-left">Name</th>
        <th class="px-3 py-2 text-left">Panel</th>
        <th class="px-3 py-2 text-left">Club</th>
        <th class="px-3 py-2 text-left">Check-in</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// Relay heat card
function relayHCard(heat, colorKey) {
  const label = heat.stage==='Final' ? 'Final' : `${heat.stage} ${heat.number}`;
  const hdrs  = {heat:'bg-blue-600', semi:'bg-purple-600', final:'bg-yellow-500'};
  const hdrBg = hdrs[colorKey] || 'bg-gray-600';
  const teams = heat.teams || [];

  const rows = teams.map((t,i) => {
    const bibColor = RBIB[(t.color||'').toLowerCase()] || '#9E9E9E';
    const members = (t.members||[]).filter(m=>m&&m!=='nan');
    return `<tr class="border-b border-gray-50">
      <td class="px-3 py-2.5 text-xs text-gray-400 w-6">${i+1}</td>
      <td class="px-3 py-2.5">
        <div class="text-sm">${members.join(', ')||'—'}</div>
        <div class="flex items-center gap-1.5 mt-0.5">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${bibColor}"></span>
          <span class="text-xs text-gray-400">${t.club}</span>
          <span class="text-xs text-gray-400">· ${t.color||'No helmet cover'}</span>
        </div>
      </td>
    </tr>`;
  }).join('');

  return `<div class="bg-white rounded-xl shadow-sm overflow-hidden flex-1 min-w-64 border border-gray-100">
    <div class="${hdrBg} px-4 py-2.5 flex items-center justify-between">
      <span class="text-white text-sm font-bold">${label}</span>
      <span class="text-white/70 text-xs">${teams.length} teams</span>
    </div>
    <table class="w-full">
      <thead><tr class="border-b border-gray-100 bg-gray-50 text-xs font-semibold text-gray-400 uppercase tracking-wider">
        <th class="px-3 py-2">#</th><th class="px-3 py-2 text-left">Team</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// ── Group view ────────────────────────────────────────────────────────────────
async function selectGroup(group) {
  curGroup = {type:'group', key:group};
  setActiveTab(`tab-${CSS.escape(group)}`);
  if (!allGroupData[group]) await loadGroup(group);
  renderGroup(group);
}

async function loadGroup(group) {
  try {
    const r = await fetch(`/api/${COMP_ID}/group/${encodeURIComponent(group)}`);
    allGroupData[group] = await r.json();
  } catch(e) {}
}

function renderGroup(group) {
  const data   = allGroupData[group] || {};
  const events = data.events || data || {};
  const count  = allGroups[group]?.skater_count || allGroups[group] || '';
  const ORDER  = ['Short Distance','Medium Distance','Long Distance'];
  const evNames = Object.keys(events).filter(n => n !== '__standings__');
  const ordered = [...ORDER.filter(n=>evNames.includes(n)), ...evNames.filter(n=>!ORDER.includes(n))];

  if (!ordered.length) {
    setContent(`<div class="text-center py-16 text-gray-400">No heats seeded yet</div>`);
    return;
  }

  let html = `<div class="flex items-center gap-3 mb-5">
    <h2 class="text-2xl font-bold text-gray-900">${group}</h2>
    <span class="text-sm text-gray-400 bg-gray-100 px-3 py-1 rounded-full">${count} skaters</span>
  </div>`;

  for (const evName of ordered) {
    const ev = events[evName];
    if (!ev) continue;
    const allStages = [
      ...(ev.heats||[]).map(h=>({...h,_key:'heat'})),
      ...(ev.semis||[]).map(h=>({...h,_key:'semi'})),
      ...(ev.finals||[]).map(h=>({...h,_key:'final'})),
    ];
    if (!allStages.length) continue;

    html += `<div class="mb-5">
      <div class="text-xs font-bold uppercase tracking-widest text-gray-400 mb-3 flex items-center gap-3">
        ${evName}<div class="flex-1 h-px bg-gray-200"></div>
      </div>
      <div class="flex gap-4 flex-wrap">
        ${allStages.map(h => hCard(h, h._key, evName)).join('')}
      </div>
    </div>`;
  }
  setContent(html);
}

// ── Relay view ────────────────────────────────────────────────────────────────
function selectRelay(name) {
  curGroup = {type:'relay', key:name};
  const idx = Object.keys(allRelays).sort().indexOf(name);
  setActiveTab(`tab-relay-${idx}`);
  renderRelay(name);
}

function renderRelay(name) {
  const ev = allRelays[name];
  if (!ev) { setContent('<div class="text-center py-16 text-gray-400">No relay data</div>'); return; }
  const allStages = [
    ...(ev.heats||[]).map(h=>({...h,_key:'heat'})),
    ...(ev.semis||[]).map(h=>({...h,_key:'semi'})),
    ...(ev.finals||[]).map(h=>({...h,_key:'final'})),
  ];
  let html = `<h2 class="text-xl font-bold text-gray-900 mb-5">🔄 ${name}</h2>
    <div class="flex gap-4 flex-wrap">
      ${allStages.map(h => relayHCard(h, h._key)).join('') || '<p class="text-gray-400 text-sm">No heats yet</p>'}
    </div>`;
  setContent(html);
}

// ── Search ────────────────────────────────────────────────────────────────────
function doSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) { if (curGroup) { curGroup.type==='group'?renderGroup(curGroup.key):renderRelay(curGroup.key); } return; }
  const results = [];
  Object.entries(allGroupData).forEach(([group, data]) => {
    const events = data.events || data || {};
    Object.entries(events).forEach(([evName, ev]) => {
      if (evName === '__standings__') return;
      const allStages = [...(ev.heats||[]),...(ev.semis||[]),...(ev.finals||[])];
      allStages.forEach(heat => {
        (heat.skaters||[]).forEach(s => {
          if (s.full_name.toLowerCase().includes(q) || (s.panel||'').toString().includes(q)) {
            results.push({group, evName, heat, s});
          }
        });
      });
    });
  });
  if (!results.length) { setContent('<div class="text-center py-16 text-gray-400">No results found</div>'); return; }
  const byGroup = {};
  results.forEach(r => { (byGroup[r.group] = byGroup[r.group]||[]).push(r); });
  let html = '';
  Object.entries(byGroup).sort().forEach(([group, rows]) => {
    html += `<div class="text-xs font-bold uppercase tracking-widest text-gray-400 mb-2 mt-4">${group}</div>`;
    rows.forEach(({evName, heat, s}) => {
      const key = `${s.panel}__${evName}`;
      const status = checkinStatus[key] || 'pending';
      const btnLabel = status==='pending'?'Check In':status==='checked_in'?'✅ Present':'❌ DNS';
      html += `<div class="bg-white rounded-xl border border-gray-100 shadow-sm px-4 py-3 mb-2 flex items-center gap-3">
        <span class="mono text-xs text-gray-400 w-12">#${s.panel}</span>
        <span class="text-sm flex-1 ${status==='dns'?'name-dns':''}">${s.full_name}</span>
        <span class="text-xs text-gray-400">${s.club}</span>
        <span class="text-xs text-gray-300 mx-1">·</span>
        <span class="text-xs text-gray-400">${evName}</span>
        <button class="ci-btn ci-${status}"
          onclick="toggleCheckin('${esc(s.panel)}','${esc(evName)}',this)">${btnLabel}</button>
      </div>`;
    });
  });
  setContent(html);
}

// ── Schedule ──────────────────────────────────────────────────────────────────
async function renderSchedule() {
  setContent('<div class="text-center py-16 text-gray-400">Loading schedule…</div>');
  try {
    const r = await fetch(`/api/comp/${COMP_ID}/schedule`);
    const evs = await r.json().catch(() => []);
    if (!evs.length) { setContent('<div class="text-center py-16 text-gray-400">No schedule uploaded yet</div>'); return; }
    let html = '', curSection = '';
    evs.forEach(ev => {
      if (ev.section !== curSection) {
        curSection = ev.section;
        html += `<div class="flex items-center gap-3 mb-3 mt-5 first:mt-0">
          <span class="text-xs text-gray-400 bg-gray-100 border border-gray-200 rounded-full px-2.5 py-0.5 whitespace-nowrap">${ev.section_time}</span>
          <span class="text-xs font-bold uppercase tracking-widest text-gray-400 whitespace-nowrap">${ev.section}</span>
          <div class="flex-1 h-px bg-gray-200"></div>
        </div>`;
      }
      const badge = ev.status==='in_progress'
        ? `<span class="sched-badge in_progress"><span class="live-dot"></span>In Progress</span>`
        : ev.status==='done' ? `<span class="sched-badge done">✓ Done</span>`
        : `<span class="sched-badge pending">Upcoming</span>`;
      html += `<div class="sched-row ${ev.status} mb-2">
        <div class="mono text-xs text-gray-400 w-14 flex-shrink-0">${ev.race_number}</div>
        <div class="flex-1 min-w-0">
          <div class="text-sm text-gray-900">${ev.label}</div>
          <div class="text-xs text-gray-400 mt-0.5">${ev.stage}${ev.distance?' · '+ev.distance:''}${ev.note?' · '+ev.note:''}</div>
        </div>
        ${badge}
      </div>`;
    });
    setContent(html);
  } catch(e) { setContent('<div class="text-center py-16 text-gray-400">Failed to load schedule</div>'); }
}

// ── Init & Refresh ────────────────────────────────────────────────────────────
async function doRefresh() {
  if (curMode==='schedule') { renderSchedule(); return; }
  await loadCheckinStatus();
  try {
    const [gr, rr] = await Promise.all([
      fetch(`/api/${COMP_ID}/groups`), fetch(`/api/${COMP_ID}/relays`)
    ]);
    allGroups = await gr.json().catch(() => allGroups);
    allRelays  = await rr.json().catch(() => allRelays);
  } catch(e) {}
  if (curGroup) {
    if (curGroup.type==='group') { delete allGroupData[curGroup.key]; await loadGroup(curGroup.key); renderGroup(curGroup.key); }
    else renderRelay(curGroup.key);
  }
  document.getElementById('last-upd').textContent = 'Updated ' + ts();
}

async function init() {
  try {
    const [gr, rr] = await Promise.all([
      fetch(`/api/${COMP_ID}/groups`), fetch(`/api/${COMP_ID}/relays`)
    ]);
    allGroups = await gr.json().catch(() => ({}));
    allRelays  = await rr.json().catch(() => ({}));
    await loadCheckinStatus();
    buildTabs();
    const first = Object.keys(allGroups).sort()[0];
    if (first) selectGroup(first);
    document.getElementById('last-upd').textContent = 'Updated ' + ts();
  } catch(e) {
    setContent('<div class="text-center py-16 text-gray-400">Failed to load. Tap Refresh to retry.</div>');
  }
  timer = setInterval(doRefresh, 20000);
}

init();
</script>
</body>
</html>
