<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SWPL Race Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #F4511E;
  --orange-dim: #BF360C;
  --surface: #FFFFFF;
  --bg: #F5F5F7;
  --border: #E4E4EB;
  --muted: #8A8AA8;
  --text: #18182E;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex; flex-direction: column;
}

/* ── Nav ──────────────────────────────────────────── */
.nav {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center;
  padding: 0 24px; height: 54px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.nav-logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px; font-weight: 900;
  letter-spacing: .04em; color: var(--text);
  text-decoration: none;
}
.nav-logo .slash { color: var(--orange); }
.nav-right { margin-left: auto; }
.nav-manage {
  padding: 5px 14px;
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--muted);
  font-size: 12px; font-weight: 600;
  text-decoration: none;
  transition: all .15s;
}
.nav-manage:hover { color: var(--text); border-color: var(--text); }

/* ── Page header ──────────────────────────────────── */
.page-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 28px 24px 20px;
}
.page-header-inner {
  max-width: 900px; margin: 0 auto;
}
.page-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 36px; font-weight: 900;
  letter-spacing: .01em;
  color: var(--text);
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 4px;
}
.page-title-dot {
  width: 8px; height: 8px;
  background: var(--orange);
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 0 3px rgba(244,81,30,.15);
}
.page-sub {
  font-size: 13px; color: var(--muted);
  margin-left: 18px;
}

/* ── Main ─────────────────────────────────────────── */
.main {
  max-width: 900px; margin: 0 auto;
  padding: 24px 24px 60px;
  width: 100%; flex: 1;
}

/* ── Season bar ───────────────────────────────────── */
.season-bar {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.season-label {
  font-size: 11px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted);
}
.season-pill {
  padding: 5px 16px;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-size: 12px; font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer; transition: all .15s;
}
.season-pill:hover { border-color: var(--text); color: var(--text); }
.season-pill.active {
  background: var(--orange); border-color: var(--orange);
  color: #fff;
}

/* ── Comp grid ────────────────────────────────────── */
.comp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}

.comp-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  text-decoration: none;
  color: inherit;
  display: flex; flex-direction: column; gap: 12px;
  transition: all .18s;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.comp-card:hover {
  border-color: var(--orange);
  box-shadow: 0 4px 20px rgba(244,81,30,.10);
  transform: translateY(-2px);
}

.comp-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 21px; font-weight: 800;
  letter-spacing: .01em; line-height: 1.1;
  color: var(--text);
}
.comp-meta {
  display: flex; flex-direction: column; gap: 4px;
}
.comp-meta-row {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--muted);
}
.comp-foot {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: auto; padding-top: 12px;
  border-top: 1px solid var(--border);
}
.comp-badge {
  display: inline-flex;
  padding: 2px 9px; border-radius: 5px;
  font-size: 10px; font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase;
}
.badge-indoor  { background: #E3F2FD; color: #1565C0; }
.badge-outdoor { background: #E8F5E9; color: #2E7D32; }

.comp-cta {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 700;
  color: var(--orange);
}
.comp-cta-arrow { transition: transform .15s; }
.comp-card:hover .comp-cta-arrow { transform: translateX(3px); }

/* ── States ───────────────────────────────────────── */
.loading-state, .empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.spinner {
  width: 28px; height: 28px;
  border: 2.5px solid var(--border);
  border-top-color: var(--orange);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Footer ───────────────────────────────────────── */
.footer {
  text-align: center;
  padding: 20px 24px;
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--muted);
}
.footer a { color: var(--muted); text-decoration: none; }
.footer a:hover { color: var(--text); }

/* ── Mobile ───────────────────────────────────────── */
@media (max-width: 600px) {
  .page-header { padding: 20px 16px 16px; }
  .page-title  { font-size: 28px; }
  .main        { padding: 16px 16px 48px; }
  .nav         { padding: 0 16px; }
}
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">SWPL<span class="slash">/</span>RACING</a>
  <div class="nav-right">
    <a href="/manage" class="nav-manage">Operator ↗</a>
  </div>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <div class="page-title">
      <span class="page-title-dot"></span>
      SWPL Race Results
    </div>
    <p class="page-sub">Select a competition to view live results, standings &amp; schedules</p>
  </div>
</div>

<main class="main" id="main">
  <div class="season-bar" id="season-bar" style="display:none"></div>
  <div class="comp-grid" id="comp-grid">
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading competitions…</p>
    </div>
  </div>
</main>

<footer class="footer">
  South West Pacific League &nbsp;·&nbsp; <a href="/manage">Operator Access</a>
</footer>

<script>
let _allComps = [], _seasons = [], _selected = null;

async function init() {
  try {
    const r = await fetch('/api/public_competitions');
    const d = await r.json();
    _allComps = d.competitions || [];
    _seasons  = d.seasons      || [];
    if (!_allComps.length) { renderEmpty('No competitions are currently published.'); return; }
    if (_seasons.length > 1) buildSeasonBar();
    _selected = _seasons[0] || null;
    renderComps();
  } catch (e) {
    renderEmpty('Could not load competitions. Please try again later.');
  }
}

function buildSeasonBar() {
  const bar = document.getElementById('season-bar');
  bar.style.display = 'flex';
  let html = '<span class="season-label">Season</span>';
  _seasons.forEach((s, i) => {
    html += `<button class="season-pill ${i===0?'active':''}" onclick="selectSeason('${s}',this)">${s}</button>`;
  });
  bar.innerHTML = html;
}

function selectSeason(season, btn) {
  _selected = season;
  document.querySelectorAll('.season-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  renderComps();
}

function renderComps() {
  const grid = document.getElementById('comp-grid');
  const comps = _selected ? _allComps.filter(c => (c.season||'Other') === _selected) : _allComps;
  if (!comps.length) {
    grid.innerHTML = `<div class="empty-state"><div class="spinner" style="opacity:.3"></div><p>No competitions this season.</p></div>`;
    return;
  }
  grid.innerHTML = comps.map((c, i) => `
    <a href="/public/${c.id}" class="comp-card" style="animation-delay:${i*.06}s">
      <div class="comp-name">${esc(c.name)}</div>
      <div class="comp-meta">
        ${c.venue ? `<div class="comp-meta-row">📍 ${esc(c.venue)}</div>` : ''}
        ${c.date  ? `<div class="comp-meta-row">📅 ${esc(c.date)}</div>`  : ''}
      </div>
      <div class="comp-foot">
        <span class="comp-badge badge-${c.type}">${c.type}</span>
        <span class="comp-cta">View Results <span class="comp-cta-arrow">→</span></span>
      </div>
    </a>`).join('');
}

function renderEmpty(msg) {
  document.getElementById('comp-grid').innerHTML =
    `<div class="empty-state"><p>${msg}</p></div>`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
