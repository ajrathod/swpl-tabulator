<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SWPL Race Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #F4511E;
  --orange-dim: #BF360C;
  --surface: #FFFFFF;
  --bg: #F5F5F7;
  --border: #E4E4EB;
  --muted: #8A8AA8;
  --text: #18182E;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex; flex-direction: column;
}

/* ── Nav ──────────────────────────────────────────── */
.nav {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center;
  padding: 0 24px; height: 54px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.nav-logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px; font-weight: 900;
  letter-spacing: .04em; color: var(--text);
  text-decoration: none;
}
.nav-logo .slash { color: var(--orange); }
.nav-right { margin-left: auto; }
.nav-manage {
  padding: 5px 14px;
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--muted);
  font-size: 12px; font-weight: 600;
  text-decoration: none; transition: all .15s;
}
.nav-manage:hover { color: var(--text); border-color: var(--text); }

/* ── Hero ──────────────────────────────────────────── */
.hero {
  position: relative;
  min-height: 280px;
  display: flex; align-items: center;
  overflow: hidden;
  background:
    url('https://images.unsplash.com/photo-1528836357230-34b260feb885?w=1400&q=75&fit=crop&crop=center')
    center / cover no-repeat;
}

/* White gradient overlay: opaque on left for text, fades on right */
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(
    105deg,
    rgba(255,255,255,.97) 0%,
    rgba(255,255,255,.92) 38%,
    rgba(255,255,255,.55) 62%,
    rgba(255,255,255,.15) 100%
  );
}

.hero-content {
  position: relative; z-index: 1;
  padding: 48px 32px;
  max-width: 520px;
}
.hero-kicker {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 10px; font-weight: 700;
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--orange); margin-bottom: 12px;
}
.hero-kicker::before {
  content: ''; width: 20px; height: 2px;
  background: var(--orange); display: inline-block;
  flex-shrink: 0;
}
.hero-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(40px, 6vw, 68px);
  font-weight: 900; line-height: .95;
  letter-spacing: -.01em; color: var(--text);
  margin-bottom: 12px;
}
.hero-title .accent { color: var(--orange); }
.hero-sub {
  font-size: 14px; line-height: 1.6;
  color: var(--muted); max-width: 380px;
}

/* Photo attribution (tiny, required by Unsplash) */
.hero-credit {
  position: absolute; bottom: 8px; right: 10px; z-index: 2;
  font-size: 9px; color: rgba(0,0,0,.35);
  text-decoration: none;
}
.hero-credit:hover { color: rgba(0,0,0,.6); }

/* ── Photo strip ───────────────────────────────────── */
.photo-strip {
  display: flex; gap: 2px;
  height: 90px; overflow: hidden;
  background: var(--bg);
}
.photo-strip-img {
  flex: 1;
  background: center/cover no-repeat;
  min-width: 0;
  filter: saturate(.85);
  transition: filter .2s;
}
.photo-strip-img:hover { filter: saturate(1.1); }

/* ── Main ──────────────────────────────────────────── */
.main {
  max-width: 900px; margin: 0 auto;
  padding: 24px 24px 60px;
  width: 100%; flex: 1;
}

/* ── Season bar ────────────────────────────────────── */
.season-bar {
  display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap; margin-bottom: 24px;
}
.season-label {
  font-size: 12px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); margin-right: 2px;
}
.season-pill {
  padding: 8px 22px;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 15px; font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer; transition: all .15s;
}
.season-pill:hover { border-color: var(--orange); color: var(--orange); }
.season-pill.active {
  background: var(--orange); border-color: var(--orange); color: #fff;
}

/* ── Comp grid ─────────────────────────────────────── */
.comp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}
.comp-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  text-decoration: none;
  color: inherit;
  display: flex; flex-direction: column; gap: 12px;
  transition: all .18s;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
  position: relative; overflow: hidden;
}
.comp-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--orange); border-radius: 14px 14px 0 0;
  opacity: 0; transition: opacity .2s;
}
.comp-card:hover {
  border-color: var(--orange);
  box-shadow: 0 4px 20px rgba(244,81,30,.10);
  transform: translateY(-2px);
}
.comp-card:hover::before { opacity: 1; }
.comp-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 21px; font-weight: 800;
  letter-spacing: .01em; line-height: 1.1;
  color: var(--text);
}
.comp-meta {
  display: flex; flex-direction: column; gap: 4px;
}
.comp-meta-row {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--muted);
}
.comp-foot {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: auto; padding-top: 12px;
  border-top: 1px solid var(--border);
}
.comp-badge {
  display: inline-flex;
  padding: 2px 9px; border-radius: 5px;
  font-size: 10px; font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase;
}
.badge-indoor  { background: #E3F2FD; color: #1565C0; }
.badge-outdoor { background: #E8F5E9; color: #2E7D32; }
.comp-cta {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 700; color: var(--orange);
}
.comp-cta-arrow { transition: transform .15s; }
.comp-card:hover .comp-cta-arrow { transform: translateX(3px); }

/* ── States ────────────────────────────────────────── */
.loading-state, .empty-state {
  grid-column: 1 / -1;
  text-align: center; padding: 60px 20px; color: var(--muted);
}
.spinner {
  width: 28px; height: 28px;
  border: 2.5px solid var(--border);
  border-top-color: var(--orange);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Footer ────────────────────────────────────────── */
.footer {
  text-align: center; padding: 20px 24px;
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--muted);
}
.footer a { color: var(--muted); text-decoration: none; }
.footer a:hover { color: var(--text); }

/* ── Mobile ────────────────────────────────────────── */
@media (max-width: 600px) {
  .hero         { min-height: 200px; }
  .hero-content { padding: 36px 20px; }
  .hero-title   { font-size: 38px; }
  .hero::before {
    background: linear-gradient(
      105deg,
      rgba(255,255,255,.98) 0%,
      rgba(255,255,255,.95) 55%,
      rgba(255,255,255,.6) 100%
    );
  }
  .photo-strip  { height: 64px; }
  .main         { padding: 16px 16px 48px; }
  .nav          { padding: 0 16px; }
}
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">SWPL<span class="slash">/</span>RACING</a>
  <div class="nav-right">
    <a href="/manage" class="nav-manage">Operator ↗</a>
  </div>
</nav>

<!-- Hero with inline skating background photo -->
<section class="hero">
  <div class="hero-content">
    <div class="hero-kicker">Inline Speed Skating</div>
    <h1 class="hero-title">SWPL<br><span class="accent">Race Results</span></h1>
    <p class="hero-sub">Select a competition below to view live results, standings &amp; race schedules.</p>
  </div>
  <a class="hero-credit" href="https://unsplash.com/photos/P6BChxXhRD8" target="_blank" rel="noopener">Photo: Unsplash</a>
</section>

<!-- Photo strip -->
<div class="photo-strip" aria-hidden="true">
  <div class="photo-strip-img" style="background-image:url('https://images.unsplash.com/photo-1735673670177-96046a596322?w=600&q=70&fit=crop&crop=center')"></div>
  <div class="photo-strip-img" style="background-image:url('https://images.unsplash.com/photo-1528836357230-34b260feb885?w=600&q=70&fit=crop&crop=top')"></div>
  <div class="photo-strip-img" style="background-image:url('https://images.unsplash.com/photo-1740226174906-7ada0fda7d96?w=600&q=70&fit=crop&crop=center')"></div>
</div>

<main class="main" id="main">
  <div class="season-bar" id="season-bar" style="display:none"></div>
  <div class="comp-grid" id="comp-grid">
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading competitions…</p>
    </div>
  </div>
</main>

<footer class="footer">
  South West Pacific League &nbsp;·&nbsp; <a href="/manage">Operator Access</a>
</footer>

<script>
let _allComps = [], _seasons = [], _selected = null;

async function init() {
  try {
    const r = await fetch('/api/public_competitions');
    const d = await r.json();
    _allComps = d.competitions || [];
    _seasons  = d.seasons      || [];
    if (!_allComps.length) { renderEmpty('No competitions are currently published.'); return; }
    if (_seasons.length > 1) buildSeasonBar();
    _selected = _seasons[0] || null;
    renderComps();
  } catch (e) {
    renderEmpty('Could not load competitions. Please try again later.');
  }
}

function buildSeasonBar() {
  const bar = document.getElementById('season-bar');
  bar.style.display = 'flex';
  let html = '<span class="season-label">Season</span>';
  _seasons.forEach((s, i) => {
    html += `<button class="season-pill ${i===0?'active':''}" onclick="selectSeason('${s}',this)">${s}</button>`;
  });
  bar.innerHTML = html;
}

function selectSeason(season, btn) {
  _selected = season;
  document.querySelectorAll('.season-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  renderComps();
}

function renderComps() {
  const grid = document.getElementById('comp-grid');
  const comps = _selected ? _allComps.filter(c => (c.season||'Other') === _selected) : _allComps;
  if (!comps.length) {
    grid.innerHTML = `<div class="empty-state"><p>No competitions this season.</p></div>`;
    return;
  }
  grid.innerHTML = comps.map((c, i) => `
    <a href="/public/${c.id}" class="comp-card" style="animation-delay:${i*.06}s">
      <div class="comp-name">${esc(c.name)}</div>
      <div class="comp-meta">
        ${c.venue ? `<div class="comp-meta-row">📍 ${esc(c.venue)}</div>` : ''}
        ${c.date  ? `<div class="comp-meta-row">📅 ${esc(c.date)}</div>`  : ''}
      </div>
      <div class="comp-foot">
        <span class="comp-badge badge-${c.type}">${c.type}</span>
        <span class="comp-cta">View Results <span class="comp-cta-arrow">→</span></span>
      </div>
    </a>`).join('');
}

function renderEmpty(msg) {
  document.getElementById('comp-grid').innerHTML =
    `<div class="empty-state"><p>${msg}</p></div>`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
