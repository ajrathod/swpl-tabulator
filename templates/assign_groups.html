<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{comp.name}} — Assign Groups</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#F4511E',dark:'#BF360C'}}}}}</script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',system-ui,sans-serif; }
  .mono { font-family:'DM Mono',monospace; }
  .sortable-ghost  { opacity:.35; background:#FFF3F0; border-color:#F4511E !important; }
  .sortable-chosen { box-shadow:0 0 0 2px #F4511E; border-radius:8px; }
  .drag-handle { cursor:grab; user-select:none; }
  .drag-handle:active { cursor:grabbing; }
  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-thumb { background:#D1D5DB; border-radius:3px; }
  .athlete-card { transition: all .12s; }
  .athlete-card.selected {
    background: #FFF3F0 !important;
    border-color: #F4511E !important;
    box-shadow: 0 0 0 1.5px #F4511E;
  }
  .athlete-card.selected .check-icon { display:flex !important; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="fixed top-0 inset-x-0 z-50 bg-white border-b border-gray-200 h-14 flex items-center px-4 gap-3 shadow-sm">
  <a href="/comp/{{comp.id}}" class="text-gray-400 hover:text-gray-700 text-sm">← Back to Operator</a>
  <span class="text-gray-300">/</span>
  <span class="font-bold text-gray-900 text-sm truncate">{{comp.name}} — Assign Groups</span>
  <div class="ml-auto flex items-center gap-3">
    <span id="counter" class="text-sm text-gray-500"></span>
    <button id="save-btn" onclick="saveAssignments()"
      class="px-4 py-2 bg-brand text-white rounded-lg text-sm font-semibold hover:bg-brand-dark transition">
      💾 Save Assignments
    </button>
    <button id="seed-btn" onclick="seedHeats()" disabled
      class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-semibold hover:bg-green-700 transition disabled:opacity-40 disabled:cursor-not-allowed"
      title="Seeds heats for all assigned athletes — unassigned athletes are skipped">
      ⚡ Seed Heats
    </button>
  </div>
</header>

<!-- Multi-select action bar -->
<div id="action-bar" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-[100]
  bg-gray-900 text-white rounded-2xl shadow-2xl px-5 py-3
  flex items-center gap-3 min-w-80">
  <span id="sel-count" class="text-sm font-semibold"></span>
  <span class="text-gray-500 text-sm">→ Assign to:</span>
  <select id="bulk-group-sel"
    class="bg-gray-800 text-white text-sm rounded-lg px-3 py-1.5 outline-none border border-gray-600 focus:border-brand">
    <option value="">Pick group…</option>
  </select>
  <button onclick="bulkAssign()"
    class="px-4 py-1.5 bg-brand rounded-lg text-sm font-semibold hover:bg-brand-dark transition">
    Assign
  </button>
  <button onclick="clearSelection()"
    class="text-gray-400 hover:text-white text-sm px-2">✕</button>
</div>

<div class="flex pt-14 min-h-screen">
  <aside class="fixed top-14 left-0 bottom-0 w-72 bg-white border-r border-gray-200 flex flex-col z-40">
    <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
      <div>
        <h2 class="font-bold text-sm">Unassigned</h2>
        <p class="text-xs text-gray-400 mt-0.5">Drag or click to select → assign</p>
      </div>
      <span id="unassigned-count" class="bg-orange-100 text-orange-700 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
    </div>
    <div class="px-3 py-2 border-b border-gray-100">
      <input id="pool-search" type="text" placeholder="Search…"
        class="w-full px-3 py-1.5 text-sm border border-gray-200 rounded-lg outline-none focus:border-brand"
        oninput="filterPool()">
    </div>
    <div class="flex-1 overflow-y-auto px-3 py-2" id="pool-container"></div>
  </aside>

  <main class="ml-72 flex-1 p-4 overflow-x-auto">
    <div class="flex items-center gap-2 mb-3 flex-wrap">
      <button onclick="addGroup()" class="px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-xs font-semibold text-gray-600 hover:bg-gray-50">+ Add Group</button>
      <button onclick="loadPrevGroups()" class="px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-xs font-semibold text-gray-600 hover:bg-gray-50">📋 Load Previous Groups</button>
      <span class="text-xs text-gray-400" id="prev-label"></span>
    </div>
    <div class="flex gap-3 items-start flex-wrap" id="group-columns"></div>
  </main>
</div>

<div id="toast" class="fixed bottom-20 right-5 z-[99] px-4 py-3 rounded-xl text-sm font-semibold text-white shadow-lg transition-all duration-200 opacity-0 translate-y-2 pointer-events-none max-w-xs"></div>

<script>
const COMP_ID    = {{comp.id}};
const GROUPS_KEY = `pw_groups_${COMP_ID}`;
let allAthletes  = [];
let groups       = [];
let sortables    = {};
let poolSortables = [];
let hasChanges   = false;
let selectedIds  = new Set(); // set of reg_id strings

function saveGroupsLS() { try{localStorage.setItem(GROUPS_KEY,JSON.stringify(groups));}catch(e){} }
function loadGroupsLS() { try{return JSON.parse(localStorage.getItem(GROUPS_KEY))||[];}catch(e){return[];} }

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  const r = await fetch(`/api/comp/${COMP_ID}/group_assignments`);
  const d = await r.json();
  allAthletes = d.athletes || [];

  const fromDB = [...new Set(allAthletes.filter(a=>a.group_name).map(a=>a.group_name))];
  const fromLS = loadGroupsLS();
  groups = [...new Set([...fromDB,...fromLS])].sort();
  saveGroupsLS();

  renderGroupColumns();
  renderPool();
  updateCounter();
  updateBulkGroupSel();
}

// ── Selection ─────────────────────────────────────────────────────────────────
function toggleSelect(regId, el) {
  const id = String(regId);
  if (selectedIds.has(id)) {
    selectedIds.delete(id);
    el.classList.remove('selected');
  } else {
    selectedIds.add(id);
    el.classList.add('selected');
  }
  updateActionBar();
}

function selectClub(club) {
  const unassigned = allAthletes.filter(a => !a.group_name && a.club === club);
  unassigned.forEach(a => selectedIds.add(String(a.id)));
  // Re-render pool to show selection state
  renderPool();
  updateActionBar();
}

function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('.athlete-card.selected').forEach(el => el.classList.remove('selected'));
  updateActionBar();
}

function updateActionBar() {
  const bar = document.getElementById('action-bar');
  if (selectedIds.size === 0) {
    bar.classList.add('hidden');
  } else {
    bar.classList.remove('hidden');
    document.getElementById('sel-count').textContent = `${selectedIds.size} selected`;
  }
}

function updateBulkGroupSel() {
  const sel = document.getElementById('bulk-group-sel');
  sel.innerHTML = '<option value="">Pick group…</option>' +
    groups.map(g => `<option value="${g}">${g}</option>`).join('');
}

function bulkAssign() {
  const groupName = document.getElementById('bulk-group-sel').value;
  if (!groupName) { toast('Pick a group first', 'error'); return; }

  selectedIds.forEach(id => {
    const a = allAthletes.find(x => String(x.id) === id);
    if (a) a.group_name = groupName;
  });

  // Update group count badges
  groups.forEach(g => {
    const el = document.getElementById(`cnt-${g}`);
    if (el) el.textContent = allAthletes.filter(x => x.group_name === g).length;
  });

  const count = selectedIds.size;
  selectedIds.clear();
  renderGroupColumns();
  renderPool();
  updateCounter();
  markChanged();
  toast(`✓ ${count} athletes assigned to ${groupName}`, 'success');
}

// ── Pool ──────────────────────────────────────────────────────────────────────
function filterPool() { renderPool(); }

function renderPool() {
  const q = document.getElementById('pool-search').value.toLowerCase();
  const unassigned = allAthletes.filter(a =>
    !a.group_name && (!q || a.full_name.toLowerCase().includes(q) || a.club.toLowerCase().includes(q))
  );

  poolSortables.forEach(s => { try{s.destroy();}catch(e){} });
  poolSortables = [];

  const container = document.getElementById('pool-container');

  if (!unassigned.length) {
    container.innerHTML = `<div class="text-center py-8 text-gray-400">
      <div class="text-2xl mb-2">${q?'🔍':'✅'}</div>
      <p class="text-sm">${q?'No matches':'All athletes assigned!'}</p>
    </div>`;
    document.getElementById('unassigned-count').textContent = 0;
    // Clear selection of assigned athletes
    selectedIds.forEach(id => {
      const a = allAthletes.find(x => String(x.id) === id);
      if (a && a.group_name) selectedIds.delete(id);
    });
    updateActionBar();
    return;
  }

  const byClub = {};
  unassigned.forEach(a => { byClub[a.club] = (byClub[a.club]||[]).concat(a); });

  container.innerHTML = Object.entries(byClub).sort().map(([club, athletes]) => `
    <div class="mb-3">
      <div class="flex items-center justify-between px-1 py-1">
        <span class="text-xs font-bold uppercase tracking-wider text-gray-400 select-none">${club} (${athletes.length})</span>
        <button onclick="selectClub('${club}')"
          class="text-xs text-brand font-semibold hover:underline">Select all</button>
      </div>
      <div class="pool-club-list space-y-1" data-club="${club}">
        ${athletes.map(a => poolAthleteCard(a)).join('')}
      </div>
    </div>`).join('');

  // Init sortables per club
  container.querySelectorAll('.pool-club-list').forEach(list => {
    const s = Sortable.create(list, {
      group:       { name:'athletes', pull:true, put:false },
      animation:   150,
      ghostClass:  'sortable-ghost',
      chosenClass: 'sortable-chosen',
      handle:      '.drag-handle',
      onEnd:       onDrop,
    });
    poolSortables.push(s);
  });

  document.getElementById('unassigned-count').textContent = unassigned.length;
}

function poolAthleteCard(a) {
  const isSelected = selectedIds.has(String(a.id));
  return `<div class="athlete-card bg-white border border-gray-200 rounded-lg px-3 py-2 flex items-center gap-2 cursor-pointer ${isSelected?'selected':''}"
    data-reg-id="${a.id}"
    onclick="toggleSelect('${a.id}', this)">
    <span class="drag-handle text-gray-400 select-none text-base leading-none" onclick="event.stopPropagation()">⠿</span>
    <div class="check-icon ${isSelected?'flex':'hidden'} w-4 h-4 bg-brand rounded-full items-center justify-center flex-shrink-0">
      <span class="text-white text-xs leading-none">✓</span>
    </div>
    <div class="flex-1 min-w-0">
      <div class="text-sm font-semibold truncate">${a.full_name}</div>
      <div class="text-xs mono text-gray-400">${a.club} · ${a.gender||'—'}</div>
    </div>
  </div>`;
}

function groupAthleteCard(a) {
  return `<div class="athlete-card bg-white border border-gray-200 rounded-lg px-3 py-2 flex items-center gap-2 cursor-default"
    data-reg-id="${a.id}">
    <span class="drag-handle text-gray-400 select-none text-base leading-none">⠿</span>
    <div class="flex-1 min-w-0">
      <div class="text-sm font-semibold truncate">${a.full_name}</div>
      <div class="text-xs mono text-gray-400">${a.club} · ${a.gender||'—'}</div>
    </div>
  </div>`;
}

// ── Group Columns ─────────────────────────────────────────────────────────────
function renderGroupColumns() {
  Object.values(sortables).forEach(s=>{ try{s.destroy();}catch(e){} });
  sortables = {};

  const cols = document.getElementById('group-columns');
  cols.innerHTML = groups.map(g => {
    const athletes = allAthletes.filter(a => a.group_name === g);
    return `<div class="flex flex-col w-48 flex-shrink-0">
      <div class="flex items-center justify-between mb-1.5 px-1">
        <span class="text-xs font-bold uppercase tracking-wider text-gray-500">${g}</span>
        <div class="flex items-center gap-1">
          <span class="text-xs bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded-full" id="cnt-${g}">${athletes.length}</span>
          <button onclick="removeGroup('${g}')" class="text-gray-300 hover:text-red-500 text-sm px-1 leading-none">×</button>
        </div>
      </div>
      <div class="group-list min-h-32 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200 p-1.5 space-y-1"
        data-group="${g}">
        ${athletes.map(groupAthleteCard).join('')}
      </div>
    </div>`;
  }).join('');

  cols.querySelectorAll('.group-list').forEach(list => {
    sortables[list.dataset.group] = Sortable.create(list, {
      group:       { name:'athletes', pull:true, put:true },
      animation:   150,
      ghostClass:  'sortable-ghost',
      chosenClass: 'sortable-chosen',
      handle:      '.drag-handle',
      onEnd:       onDrop,
    });
  });

  updateBulkGroupSel();
}

// ── Drop ──────────────────────────────────────────────────────────────────────
function onDrop(evt) {
  const regId     = evt.item.dataset.regId;
  const groupName = evt.to.dataset.group || '';

  const a = allAthletes.find(x => String(x.id) === String(regId));
  if (a) a.group_name = groupName;

  groups.forEach(g => {
    const el = document.getElementById(`cnt-${g}`);
    if (el) el.textContent = allAthletes.filter(x => x.group_name === g).length;
  });

  updateCounter();
  setTimeout(() => renderPool(), 100);
  markChanged();
}

function updateCounter() {
  const u = allAthletes.filter(a => !a.group_name).length;
  const assigned = allAthletes.length - u;
  document.getElementById('counter').textContent = `${u} unassigned · ${assigned} assigned`;
  document.getElementById('unassigned-count').textContent = u;
  // Enable seed button as long as at least one athlete is assigned
  document.getElementById('seed-btn').disabled = assigned === 0;
}

function markChanged() {
  hasChanges = true;
  const btn = document.getElementById('save-btn');
  if (btn && !btn.textContent.includes('*')) btn.textContent = '💾 Save Assignments *';
}

// ── Save ──────────────────────────────────────────────────────────────────────
async function saveAssignments() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = '⏳ Saving…';

  const assignments = allAthletes.map(a => ({reg_id:a.id, group_name:a.group_name||''}));
  const r = await fetch(`/api/comp/${COMP_ID}/save_group_assignments`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({assignments})
  });
  const d = await r.json();
  btn.disabled = false;
  if (d.ok) {
    hasChanges = false;
    btn.textContent = '✓ Saved';
    setTimeout(() => { btn.textContent = '💾 Save Assignments'; }, 2000);
    toast('✓ Assignments saved', 'success');
  } else {
    btn.textContent = '💾 Save Assignments';
    toast(d.error||'Save failed', 'error');
  }
}

// ── Group management ──────────────────────────────────────────────────────────
function addGroup() {
  const name = prompt('Group name (e.g. 2A, 3B):');
  if (!name?.trim()) return;
  const g = name.trim().toUpperCase();
  if (groups.includes(g)) { toast('Already exists','error'); return; }
  groups.push(g); groups.sort(); saveGroupsLS();
  renderGroupColumns(); markChanged();
}

function removeGroup(name) {
  const inGroup = allAthletes.filter(a => a.group_name === name);
  if (inGroup.length && !confirm(`Move ${inGroup.length} athletes back to unassigned?`)) return;
  inGroup.forEach(a => a.group_name = '');
  groups = groups.filter(g => g !== name); saveGroupsLS();
  renderGroupColumns(); renderPool(); updateCounter(); markChanged();
}

async function loadPrevGroups() {
  const r = await fetch(`/api/comp/${COMP_ID}/prev_groups`);
  const d = await r.json();
  if (!d.groups?.length) { toast('No previous competition found','error'); return; }
  const added = d.groups.filter(g => !groups.includes(g));
  if (!added.length) { toast('All groups already loaded','error'); return; }
  groups = [...new Set([...groups,...d.groups])].sort(); saveGroupsLS();
  renderGroupColumns();
  document.getElementById('prev-label').textContent = `From: ${d.from_comp}`;
  toast(`✓ ${added.length} groups loaded`, 'success');
  markChanged();
}

// ── Seed ──────────────────────────────────────────────────────────────────────
async function seedHeats() {
  if (hasChanges) { toast('Save assignments first','error'); return; }
  if (!confirm('Seed heats from group assignments?\nThis replaces existing event data.')) return;
  const btn = document.getElementById('seed-btn');
  btn.disabled = true; btn.textContent = '⏳ Seeding…';
  const r = await fetch(`/api/comp/${COMP_ID}/seed_from_reg`,{method:'POST'});
  const d = await r.json();
  if (d.ok) {
    toast(`✓ ${d.skater_count} athletes seeded into ${d.groups.length} groups`,'success');
    setTimeout(() => window.location=`/comp/${COMP_ID}`, 1200);
  } else {
    toast(d.error||'Error seeding','error');
    btn.disabled=false; btn.textContent='⚡ Seed Heats';
  }
}

function toast(msg, type='') {
  const t = document.getElementById('toast');
  const c = {success:'bg-green-600',error:'bg-red-600','':'bg-gray-900'};
  t.className=`fixed bottom-20 right-5 z-[99] px-4 py-3 rounded-xl text-sm font-semibold text-white shadow-lg max-w-xs transition-all duration-200 ${c[type]||c['']}`;
  t.textContent=msg; t.style.opacity='1'; t.style.transform='translateY(0)';
  clearTimeout(t._t); t._t=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(8px)';},3000);
}

window.addEventListener('beforeunload',e=>{if(hasChanges){e.preventDefault();e.returnValue='';}});
init();
</script>
</body>
</html>
