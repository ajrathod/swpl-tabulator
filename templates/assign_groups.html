<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{comp.name}} — Assign Groups</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#F4511E',dark:'#BF360C'}}}}}</script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .mono { font-family: 'DM Mono', monospace; }
  .sortable-ghost  { opacity: .35; }
  .sortable-chosen { box-shadow: 0 0 0 2px #F4511E; border-radius: 8px; }
  .drag-handle { cursor: grab; }
  .drag-handle:active { cursor: grabbing; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 3px; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Header -->
<header class="fixed top-0 inset-x-0 z-50 bg-white border-b border-gray-200 h-14 flex items-center px-4 gap-3 shadow-sm">
  <a href="/comp/{{comp.id}}" class="text-gray-400 hover:text-gray-700 text-sm">← Back to Operator</a>
  <span class="text-gray-300">/</span>
  <span class="font-bold text-gray-900 text-sm truncate">{{comp.name}} — Assign Groups</span>
  <div class="ml-auto flex items-center gap-3">
    <span id="counter" class="text-sm text-gray-500"></span>
    <button id="seed-btn" onclick="seedHeats()" disabled
      class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-semibold hover:bg-green-700 transition disabled:opacity-40 disabled:cursor-not-allowed">
      ⚡ Seed Heats
    </button>
  </div>
</header>

<!-- Layout -->
<div class="flex pt-14 min-h-screen">

  <!-- Left: Unassigned pool -->
  <aside class="fixed top-14 left-0 bottom-0 w-72 bg-white border-r border-gray-200 flex flex-col z-40">
    <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
      <div>
        <h2 class="font-bold text-sm">Unassigned</h2>
        <p class="text-xs text-gray-400 mt-0.5">Drag athletes to group columns →</p>
      </div>
      <span id="unassigned-count" class="bg-orange-100 text-orange-700 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
    </div>
    <!-- Search -->
    <div class="px-3 py-2 border-b border-gray-100">
      <input id="pool-search" type="text" placeholder="Search…"
        class="w-full px-3 py-1.5 text-sm border border-gray-200 rounded-lg outline-none focus:border-brand"
        oninput="filterPool()">
    </div>
    <!-- Pool by club -->
    <div class="flex-1 overflow-y-auto px-3 py-2" id="pool-container"></div>
  </aside>

  <!-- Right: Group columns -->
  <main class="ml-72 flex-1 p-4 overflow-x-auto">
    <div class="flex items-start gap-1 mb-3 flex-wrap">
      <button onclick="addGroup()" class="px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-xs font-semibold text-gray-600 hover:bg-gray-50 transition">+ Add Group</button>
      <button onclick="loadPrevGroups()" class="px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-xs font-semibold text-gray-600 hover:bg-gray-50 transition" id="prev-btn">📋 Load Previous Groups</button>
      <span class="text-xs text-gray-400 self-center ml-2" id="prev-label"></span>
    </div>
    <div class="flex gap-3 items-start flex-wrap" id="group-columns"></div>
  </main>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-5 right-5 z-[999] px-4 py-3 rounded-xl text-sm font-semibold text-white shadow-lg transition-all duration-200 opacity-0 translate-y-2 pointer-events-none max-w-xs bg-gray-900"></div>

<script>
const COMP_ID = {{comp.id}};
let allAthletes   = [];   // all attending athletes from API
let groups        = [];   // group name strings
let sortables     = {};   // sortable instances keyed by group name
let poolSortables = {};   // per-club pool sortables
let saving        = false;

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  const r = await fetch(`/api/comp/${COMP_ID}/group_assignments`);
  const d = await r.json();
  allAthletes = d.athletes || [];
  updateCounter();
  renderPool();

  // Load existing group columns (from assigned athletes)
  const existingGroups = [...new Set(allAthletes.filter(a => a.group_name).map(a => a.group_name))].sort();
  if (existingGroups.length) {
    groups = existingGroups;
    renderGroupColumns();
  }
}

// ── Pool ──────────────────────────────────────────────────────────────────────
function renderPool() {
  const q = document.getElementById('pool-search').value.toLowerCase();
  const unassigned = allAthletes.filter(a => !a.group_name && (!q || a.full_name.toLowerCase().includes(q) || a.club.toLowerCase().includes(q)));

  // Group by club
  const byClub = {};
  unassigned.forEach(a => byClub[a.club] = (byClub[a.club] || []).concat(a));

  const container = document.getElementById('pool-container');
  poolSortables = {};

  if (!unassigned.length) {
    container.innerHTML = `<div class="text-center py-8 text-gray-400">
      <div class="text-2xl mb-2">${q ? '🔍' : '✅'}</div>
      <p class="text-sm">${q ? 'No matches' : 'All athletes assigned!'}</p>
    </div>`;
    return;
  }

  container.innerHTML = Object.entries(byClub).sort().map(([club, athletes]) => `
    <div class="mb-3">
      <div class="text-xs font-bold uppercase tracking-wider text-gray-400 px-1 mb-1.5">${club} <span class="font-normal">(${athletes.length})</span></div>
      <div class="pool-list space-y-1" data-club="${club}">
        ${athletes.map(a => athleteCard(a, 'pool')).join('')}
      </div>
    </div>`).join('');

  // Init sortable on each club section
  container.querySelectorAll('.pool-list').forEach(list => {
    const s = Sortable.create(list, {
      group: 'athletes',
      animation: 120,
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      handle: '.drag-handle',
      onEnd: handleDrop,
    });
    poolSortables[list.dataset.club] = s;
  });

  document.getElementById('unassigned-count').textContent = unassigned.length;
}

function filterPool() { renderPool(); }

function athleteCard(a, context) {
  return `<div class="bg-white border border-gray-100 rounded-lg px-3 py-2 flex items-center gap-2 shadow-sm"
    data-reg-id="${a.id}" data-athlete-id="${a.athlete_id}">
    <span class="drag-handle text-gray-300 text-sm select-none">⠿</span>
    <div class="flex-1 min-w-0">
      <div class="text-sm font-semibold truncate">${a.full_name}</div>
      <div class="text-xs mono text-gray-400">${a.usars_no || '—'} · ${a.gender || '—'}</div>
    </div>
  </div>`;
}

// ── Group Columns ─────────────────────────────────────────────────────────────
function renderGroupColumns() {
  const cols = document.getElementById('group-columns');
  // Clear old sortables
  Object.values(sortables).forEach(s => s.destroy());
  sortables = {};

  cols.innerHTML = groups.map(g => {
    const athletes = allAthletes.filter(a => a.group_name === g);
    return `<div class="flex flex-col w-48 flex-shrink-0" data-group="${g}">
      <div class="flex items-center justify-between mb-1.5 px-1">
        <span class="text-xs font-bold uppercase tracking-wider text-gray-500">${g}</span>
        <div class="flex items-center gap-1">
          <span class="text-xs bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded-full athlete-count">${athletes.length}</span>
          <button onclick="removeGroup('${g}')" class="text-gray-300 hover:text-red-500 text-xs transition" title="Remove group">×</button>
        </div>
      </div>
      <div class="group-list min-h-24 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200 p-1.5 space-y-1"
        data-group="${g}">
        ${athletes.map(a => athleteCard(a, 'group')).join('')}
      </div>
    </div>`;
  }).join('');

  // Init sortable on each group column
  cols.querySelectorAll('.group-list').forEach(list => {
    sortables[list.dataset.group] = Sortable.create(list, {
      group: 'athletes',
      animation: 120,
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      handle: '.drag-handle',
      onEnd: handleDrop,
    });
  });
}

// ── Drop handler ──────────────────────────────────────────────────────────────
async function handleDrop(evt) {
  const card    = evt.item;
  const regId   = card.dataset.regId;
  const toList  = evt.to;
  const groupName = toList.dataset.group || null; // null = back to pool

  // Update local state
  const athlete = allAthletes.find(a => String(a.id) === String(regId));
  if (athlete) athlete.group_name = groupName || "";

  // Update counts
  updateCounts();
  updateCounter();

  // Rebuild pool to reflect changes (re-render pool section)
  renderPool();

  // Persist
  await saveAssignment(regId, groupName || "");
}

async function saveAssignment(regId, groupName) {
  const r = await fetch(`/api/comp/${COMP_ID}/assign_group`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({comp_id: COMP_ID, reg_id: parseInt(regId), group_name: groupName})
  });
  const d = await r.json();
  if (!d.ok) toast(d.error || 'Save failed', 'error');
}

function updateCounts() {
  document.querySelectorAll('[data-group]').forEach(col => {
    const g = col.dataset.group;
    const count = allAthletes.filter(a => a.group_name === g).length;
    const badge = col.closest('[data-group]')?.querySelector('.athlete-count');
    if (badge) badge.textContent = count;
  });
}

function updateCounter() {
  const unassigned = allAthletes.filter(a => !a.group_name).length;
  const assigned   = allAthletes.filter(a => a.group_name).length;
  document.getElementById('counter').textContent = `${unassigned} unassigned · ${assigned} assigned`;
  document.getElementById('unassigned-count').textContent = unassigned;
  document.getElementById('seed-btn').disabled = unassigned > 0 || allAthletes.length === 0;
}

// ── Groups management ─────────────────────────────────────────────────────────
function addGroup() {
  const name = prompt('Group name (e.g. 2A, 3B):');
  if (!name?.trim()) return;
  const g = name.trim().toUpperCase();
  if (groups.includes(g)) { toast('Group already exists', 'error'); return; }
  groups.push(g);
  groups.sort();
  renderGroupColumns();
}

function removeGroup(name) {
  const inGroup = allAthletes.filter(a => a.group_name === name);
  if (inGroup.length && !confirm(`Move ${inGroup.length} athletes back to unassigned?`)) return;
  // Unassign all athletes in this group
  inGroup.forEach(a => a.group_name = "");
  Promise.all(inGroup.map(a => saveAssignment(a.id, "")));
  groups = groups.filter(g => g !== name);
  renderGroupColumns();
  renderPool();
  updateCounter();
}

async function loadPrevGroups() {
  const r = await fetch(`/api/comp/${COMP_ID}/prev_groups`);
  const d = await r.json();
  if (!d.groups.length) { toast('No previous competition found', 'error'); return; }
  const newGroups = d.groups.filter(g => !groups.includes(g));
  if (!newGroups.length) { toast('All groups already added', 'error'); return; }
  groups = [...new Set([...groups, ...d.groups])].sort();
  renderGroupColumns();
  document.getElementById('prev-label').textContent = `Loaded from: ${d.from_comp}`;
  toast(`✓ Loaded ${newGroups.length} groups from ${d.from_comp}`, 'success');
}

// ── Seed Heats ────────────────────────────────────────────────────────────────
async function seedHeats() {
  if (!confirm('Seed heats from group assignments?\nThis will replace any existing event data.')) return;
  const btn = document.getElementById('seed-btn');
  btn.disabled = true; btn.textContent = '⏳ Seeding…';
  const r = await fetch(`/api/comp/${COMP_ID}/seed_from_reg`, {method: 'POST'});
  const d = await r.json();
  if (d.ok) {
    toast(`✓ ${d.skater_count} athletes seeded into ${d.groups.length} groups`, 'success');
    setTimeout(() => window.location = `/comp/${COMP_ID}`, 1200);
  } else {
    toast(d.error || 'Error seeding', 'error');
    btn.disabled = false; btn.textContent = '⚡ Seed Heats';
  }
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg, type='') {
  const t = document.getElementById('toast');
  const colors = {success:'bg-green-600', error:'bg-red-600', '':'bg-gray-900'};
  t.className = `fixed bottom-5 right-5 z-[999] px-4 py-3 rounded-xl text-sm font-semibold text-white shadow-lg max-w-xs transition-all duration-200 ${colors[type]||colors['']}`;
  t.textContent = msg;
  t.style.opacity = '1'; t.style.transform = 'translateY(0)';
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.style.opacity='0'; t.style.transform='translateY(8px)'; }, 3000);
}

init();
</script>
</body>
</html>
